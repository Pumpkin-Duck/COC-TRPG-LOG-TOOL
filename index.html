<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <link rel="icon" href="icon.webp" type="image/webp">
    <meta charset="UTF-8">
    <title>CoC TRPG 團錄整理工具</title>
    <style id="dynamic-theme">
        :root {
            --bg-color: #f4f1ea;
            --container-bg: #ffffff;
            --primary-color: #a67c52;
            --secondary-color: #8fa4b3;
            --text-color: #4a4a4a;
            --border-color: #dcdcdc;
            --bar-bg: #f4f1ea;
            --edit-color: #e67e22;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --container-bg: #1e1e1e;
            --primary-color: #c9ad93;
            --text-color: #d1d1d1;
            --border-color: #333333;
            --bar-bg: #121212;
        }

        @media print {
            @page {
                margin: 1.2cm;
            }

            html, body {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            body {
                background: white !important;
                color: black !important;
                padding: 0 !important;
            }

            .container {
                box-shadow: none !important;
                max-width: 100% !important;
                padding: 0 8px !important;
                border: none !important;
                background: white !important;
            }

            .no-print,
            .mode-switcher,
            .edit-btn,
            .add-ho-btn,
            .floating-insert-line,
            .floating-boundary-hint,
            .edit-tools {
                display: none !important;
            }

            #output {
                display: block !important;
                border: none !important;
                padding: 0 !important;
            }

            .block-styled {
                break-inside: auto !important;
                page-break-inside: auto !important;
                border-radius: 12px !important;
                padding: 14px 16px !important;
                margin: 6px 0 !important;
            }

            .ending-text,
            .info-bar {
                background: transparent !important;
                border: none !important;
                border-bottom: 1px solid rgba(120, 120, 120, 0.18) !important;
                border-radius: 0 !important;
                box-shadow: none !important;
                padding: 0 0 10px 0 !important;
                margin: 10px 0 18px 0 !important;
                break-inside: avoid !important;
                page-break-inside: avoid !important;
            }
            .md-quote {
                border-left: 3px solid #b8b8b8 !important;
                color: #666 !important;
                font-size: 0.95em !important;
            }

            .main-text {
                line-height: 1.9 !important;
            }
        }

       body {
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 40px 130px;
            margin: 0;
            line-height: 1.8;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            background: var(--container-bg);
            padding: 45px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.05);
        }
        body[data-log-view="channel"] {
            padding-bottom: 96px;
        }
        .theme-switch { position: fixed; top: 20px; right: 20px; padding: 10px 18px; border-radius: 30px; border: 1.5px solid var(--primary-color); background: var(--container-bg); color: var(--primary-color); cursor: pointer; font-weight: bold; z-index: 120; }
        .view-mode-switch { position: fixed; top: 20px; right: 180px; padding: 10px 18px; border-radius: 30px; border: 1.5px solid var(--primary-color); background: var(--container-bg); color: var(--primary-color); cursor: pointer; font-weight: bold; z-index: 120; }

        .mode-switcher { display: inline-flex; background: #eeeae3; padding: 5px; border-radius: 50px; border: 1px solid var(--border-color); margin-right: 20px; }
        .mode-btn { padding: 10px 25px; border-radius: 25px; border: none; cursor: pointer; font-weight: bold; transition: 0.3s; background: transparent; color: var(--text-color); opacity: 0.6; font-size: 15px; }
        .mode-btn.active { background: var(--primary-color); color: white; opacity: 1; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .channel-tabs {
            display: flex;
            align-items: flex-end;
            gap: 4px;
            flex-wrap: nowrap;
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            overflow-x: auto;
            overflow-y: hidden;
            margin: 0;
            padding: 9px 18px 0;
            border-top: 1px solid var(--border-color);
            background: var(--container-bg);
            box-shadow: 0 -6px 18px rgba(0,0,0,0.08);
            z-index: 118;
        }
        .channel-tab-btn {
            border: 1px solid var(--border-color);
            border-bottom: none;
            background: var(--bar-bg);
            color: var(--text-color);
            border-radius: 9px 9px 0 0;
            padding: 8px 16px 9px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            opacity: 0.75;
            white-space: nowrap;
            min-width: 86px;
        }
        .channel-tab-btn.active {
            background: var(--container-bg);
            border-color: var(--primary-color);
            color: var(--primary-color);
            opacity: 1;
            box-shadow: 0 -2px 0 var(--primary-color) inset;
        }
        .channel-tab-count {
            opacity: 0.75;
            margin-left: 5px;
            font-weight: 600;
        }

        h1.tool-title { text-align: center; color: var(--primary-color); margin-bottom: 45px; font-size: 32px; letter-spacing: 2px; font-weight: 900; }
        label { display: block; font-weight: bold; margin-bottom: 12px; color: var(--primary-color); font-size: 16px; }
        input[type="text"], textarea { width: 100%; padding: 15px 20px; border: 1.5px solid var(--border-color); border-radius: 12px; box-sizing: border-box; background-color: #fafafa; color: #4a4a4a; margin-bottom: 15px; font-size: 15px; transition: 0.3s; }
        [data-theme="dark"] input[type="text"], [data-theme="dark"] textarea { background-color: #2a2a2a; color: #eee; border-color: #444; }

        .row { display: flex; gap: 40px; margin-bottom: 25px; align-items: flex-start; width: 100%; }
        .col-half { flex: 1; min-width: 0; }

        .color-pill {
            display: flex;
            align-items: center;
            background: #fff;
            padding: 8px 15px;
            border-radius: 20px; 
            border: 1.2px solid var(--border-color);
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
        }
       
        .config-title {
            font-weight: bold;
            margin-bottom: 12px;
            color: var(--primary-color);
            font-size: 16px;
            display: block;
            padding-bottom: 5px;
            border-bottom: 1px solid rgba(166, 124, 82, 0.2); 
            margin-top: 30px;
        }

        [data-theme="dark"] .color-pill {
            background: #2a2a2a;
        }
        input[type="color"] { width: 22px; height: 22px; border: none; cursor: pointer; background: none; padding: 0; border-radius: 50%; overflow: hidden; flex-shrink: 0; }
        input[type="color"]::-webkit-color-swatch { border: none; border-radius: 50%; }
        .hex-field { border: none !important; background: transparent !important; margin-bottom: 0 !important; padding: 0 !important; width: 75px !important; font-family: monospace; font-size: 14px !important; color: inherit !important; font-weight: bold; }

        #ho-editor-list { margin-bottom: 15px; }
        .ho-edit-item { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; }
        .ho-tag-input { width: 80px !important; flex-shrink: 0; text-align: center; }
        .pl-name-input { flex: 1; min-width: 0; }

        .add-ho-btn { background: var(--container-bg); color: var(--primary-color); border: 1.5px solid var(--primary-color); padding: 8px 20px; border-radius: 12px; cursor: pointer; font-weight: bold; font-size: 14px; margin-top: 5px; transition: 0.2s; }

        .channel-item { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; width: 100%; padding: 5px 0; border-bottom: 1px solid rgba(0,0,0,0.05); }
        .channel-name { min-width: 80px; font-weight: bold; color: var(--primary-color); }
        .channel-tag-input { width: 150px !important; margin: 0 !important; padding: 8px 15px !important; }

        #output { margin-top: 60px; padding: 50px; border: 1px solid var(--border-color); background: var(--container-bg); display: none; border-radius: 25px; }
        .log-item {
            position: relative;
            margin: 0;
        }

        /* main 文字段落 */
        .log-item.item-main .log-line {
            margin-top: 0;
            margin-bottom: 1.8em;
        }

       /* 一般 block 和 block 之間，保留清楚間距 */
        .log-item.item-block {
            margin-top: 18px;
        }

        /* 如果是真的合併塊第二塊以後，外層不要再多間距 */
        .log-item.merged-follow {
            margin-top: 0 !important;
        }

        /* main 後接 block，保留更明顯距離 */
        .log-item.after-main.item-block {
            margin-top: 28px;
        }

        /* block 後接 main，保留更明顯距離 */
        .log-item.after-block.item-main {
            margin-top: 28px;
        }

        /* ending 前後也保留明顯距離 */
        .log-item.item-ending {
            margin-top: 28px;
        }

        .log-item.after-ending.item-main,
        .log-item.after-ending.item-block {
            margin-top: 28px;
        }


        .edit-tools{
            position: absolute;
            left: -55px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 8px;
            opacity: 1;
            z-index: 20;
        }

        .edit-tools button{
            width:35px;
            height:35px;
            border-radius:50%;
            color:#e67e22;
            border:1.5px solid var(--border-color);
            background:var(--container-bg);
            cursor:pointer;
            font-size:15px;
            display:flex;
            align-items:center;
            justify-content:center;
            box-shadow:0 2px 5px rgba(0,0,0,0.1);
        }

        /* 編輯模式下，整個區塊可點選 */
        [data-mode="edit"] .log-item {
            cursor: pointer;
        }

        /* 編輯文字時改為 I 字形游標 */
        [data-mode="edit"] .text-content[contenteditable="true"] {
            cursor: text;
            user-select: text;
        }

        /* 被選中的區塊 */
        .log-item.active-item {
            outline: 1.5px dashed var(--primary-color);
            outline-offset: 6px;
            border-radius: 10px;
            background: rgba(166, 124, 82, 0.04);
        }

        .log-item.move-group {
            outline: 1px solid rgba(217, 119, 6, 0.22);
            outline-offset: 2px;
            background: rgba(217, 119, 6, 0.03);
        }

        .log-item.move-source {
            outline: 2px solid rgba(217, 119, 6, 0.45);
            outline-offset: 4px;
            background: rgba(217, 119, 6, 0.05);
        }

        .log-item.move-source::before {
            content: "移動中";
            position: absolute;
            top: -12px;
            left: 12px;
            background: #fff7ed;
            color: #d97706;
            border: 1px solid rgba(217,119,6,0.35);
            border-radius: 999px;
            padding: 2px 10px;
            font-size: 11px;
            font-weight: 700;
            line-height: 1.4;
            z-index: 40;
        }

        .text-content { 
            white-space: pre-wrap;
            outline: none;
            display: block;
            width: 100%;
            font-size: 15px;
        }
            [data-mode="edit"] .text-content:focus { background: rgba(230, 126, 34, 0.05); border-radius: 8px; }

        .log-line { 
            margin-bottom: 1.8em; 
            word-wrap: break-word; 
            font-size: 15px; 
        }

        .log-image-wrap {
            margin: 18px 0 26px;
            text-align: center;
        }

        .log-image {
            max-width: min(100%, 760px);
            max-height: 80vh;
            border-radius: 10px;
            display: inline-block;
        }

        
        .char-name-label { 
            display: block; 
            font-weight: bold; 
            margin-bottom: 2px; 
            font-size: 0.95em; 
        }
        .other-bubble { 
            width: fit-content; 
            max-width: 75%; 
            margin-left: auto; 
            padding: 15px 25px; 
            border-radius: 22px 22px 4px 22px; 
            text-align: right; 
            font-size: 15px; 
            margin-bottom: 1.6em; 
            border-right: 6px solid var(--secondary-color); 
            background: var(--bar-bg); 
        }
        .block-styled { 
            padding: 30px 35px; 
            border-radius: 15px; 
            margin: 0; 
            border-left: 10px solid ; 
            transition: none; 
        }
        .info-tag { 
            font-weight: 700; 
            color: var(--primary-color); 
            font-size: 13px; 
            display: block; 
            margin-bottom: 12px; 
            letter-spacing: 1px; }

        /* 當區塊被標記為合併時：去掉上方圓角、去掉上方邊框、去掉上方間距 */
        .block-styled[data-merged="true"] {
            margin-top: 0 !important;
            border-top-left-radius: 0 !important;
            border-top-right-radius: 0 !important;
            border-top: none !important;
            padding-top: 1.8em !important; /* 縮短內部頂部間距 */
        }

        /* 隱藏合併區塊內重複的標籤（例如：情報、系統） */
        .block-styled[data-merged="true"] .info-tag {
            display: none;
        }

        /* 處理被合併者的「前一個元素」：去掉下方圓角、去掉下方間距 */
        .log-item:has(+ .log-item .block-styled[data-merged="true"]) .block-styled {
            border-bottom-left-radius: 0 !important;
            border-bottom-right-radius: 0 !important;
            margin-bottom: 0 !important;
            padding-bottom: 0 !important;
        }

        /* 讓資訊列的間距與字級完全貼合內文 */
        .info-bar {
           padding: 10px 0;    /* 縮小上下內距 */
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 40px; /* 這就是分隔線上的那行空白感 */
            margin-bottom: 40px;  /* 分隔線下方的空白，與內文區隔 */
        }

        .info-line {
            display: flex;
            align-items: baseline; 
            margin-bottom: 4px !important; 
            font-size: 15px !important; /* 調整成跟內文一樣大 */
            line-height: 1.6 !important;
            font-weight: normal;
        }

        .info-line strong {
            min-width: 50px; /* 標籤寬度 */
            margin-right: 15px;
            flex-shrink: 0;
            font-weight: 400;
        }

        

        .file-upload-wrapper { text-align: center; padding: 55px 30px; border: 2.5px dashed var(--border-color); border-radius: 20px; background: rgba(0,0,0,0.01); margin: 40px 0; transition: 0.3s; }
        .file-upload-wrapper label { font-size: 18px; margin-bottom: 25px; color: var(--primary-color); opacity: 0.9; }

        .generate-btn { background-color: var(--primary-color); color: white; border: none; padding: 18px; border-radius: 15px; cursor: pointer; font-size: 18px; font-weight: bold; width: 100%; margin-top: 10px; transition: 0.3s; box-shadow: 0 6px 15px rgba(166, 124, 82, 0.2); }
        .action-btn { background: #8fa4b3; color: white; padding: 15px 30px; border: none; border-radius: 15px; cursor: pointer; font-weight: bold; font-size: 16px; height: 60px; transition: 0.3s; display: flex; align-items: center; justify-content: center; text-align: center; line-height: 1.8; }
        
        .floating-boundary-hint {
            position: absolute;
            left: 0;
            right: 0;
            height: 0;
            z-index: 36;
            pointer-events: none;
        }

        .floating-boundary-hint::before {
            content: "";
            position: absolute;
            left: 18px;
            right: 18px;
            top: 0;
            border-top: 1px dashed #d97706;
            opacity: 0.55;
        }

        .floating-boundary-hint button {
            position: absolute;
            left: 50%;
            top: 0;
            transform: translate(-50%, -50%);
            background: #fff7ed;
            color: #d97706;
            border: 1px solid rgba(217,119,6,0.35);
            border-radius: 999px;
            padding: 1px 10px;
            font-size: 11px;
            line-height: 1.5;
            cursor: pointer;
            pointer-events: auto;
        }
        
        #out-content {
            position: relative;
        }


        .floating-insert-line {
            position: absolute;
            left: 0;
            right: 0;
            height: 0;
            z-index: 35;
            pointer-events: none;
        }

        .floating-insert-line::before {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            border-top: 2px dashed var(--primary-color);
            opacity: 0.95;
        }

        .floating-insert-line span {
            position: absolute;
            left: 50%;
            top: 0;
            transform: translate(-50%, -50%);
            background: var(--container-bg);
            padding: 0 10px;
            font-size: 12px;
            color: var(--primary-color);
            border-radius: 999px;
            border: 1px solid var(--border-color);
            white-space: nowrap;
            line-height: 1.6;
        }
        .md-quote {
            display: block;
            margin: 8px 0;
            padding-left: 12px;
            border-left: 3px solid #b8b8b8;
            color: #7a7a7a;
            font-size: 0.95em;
            line-height: 1.8;
        }

        [data-theme="dark"] .md-quote {
            border-left-color: #666;
            color: #a0a0a0;
        }

        .inline-setting-row {
            margin-top: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .inline-checkbox {
            margin-bottom: 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .mini-action-btn {
            background: var(--container-bg);
            color: var(--primary-color);
            border: 1.5px solid var(--primary-color);
            padding: 7px 14px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            line-height: 1.4;
        }

        .mini-action-btn:hover {
            filter: brightness(0.95);
        }
        [data-theme="dark"] .mini-action-btn {
            background: #6e7a68;
        }


        .toc-panel {
            position: fixed;
            left: 0;
            top: 140px;
            width: 250px;
            max-height: calc(100vh - 180px);
            background: var(--container-bg);
            border: 1px solid var(--border-color);
            border-left: none;
            border-radius: 0 16px 16px 0;
            box-shadow: 0 12px 30px rgba(0,0,0,0.10);
            z-index: 119;
            overflow: hidden;
            transform: translateX(calc(-100% + 42px));
            transition: transform 0.25s ease;
        }

        .toc-panel:hover {
            transform: translateX(0);
        }  

        .toc-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-color);
            font-weight: bold;
            color: var(--primary-color);
        }


        .toc-list {
            overflow-y: auto;
            max-height: calc(100vh - 235px);
            padding: 10px;
        }

        .toc-item {
            display: block;
            width: 100%;
            text-align: left;
            border: none;
            background: transparent;
            color: var(--text-color);
            padding: 8px 10px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 4px;
        }

        .toc-item:hover {
            background: rgba(166, 124, 82, 0.08);
        }

        .toc-item.active {
            background: rgba(166, 124, 82, 0.12);
            color: var(--primary-color);
            font-weight: 700;
        }

        .toc-inline-editor {
            margin-top: 10px;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background: rgba(166, 124, 82, 0.04);
        }

        .item-meta-editor {
            display: flex;
            gap: 12px;
            align-items: center;
            margin: 0 0 10px 0;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background: color-mix(in srgb, var(--primary-color) 7%, var(--container-bg));
        }

        .meta-field {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 0;
            flex: 1;
        }

        .meta-field-label {
            font-size: 11px;
            font-weight: 700;
            color: var(--primary-color);
            line-height: 1.2;
            opacity: 0.85;
        }

        .meta-control {
            width: 100%;
            margin: 0 !important;
            padding: 8px 34px 8px 12px !important;
            border: 1px solid var(--border-color) !important;
            border-radius: 9px !important;
            background-color: var(--container-bg) !important;
            color: var(--text-color) !important;
            font-size: 13px !important;
            font-weight: 700;
            line-height: 1.4;
            box-sizing: border-box;
        }

        select.meta-control {
            appearance: none;
            background-image: linear-gradient(45deg, transparent 50%, var(--primary-color) 50%), linear-gradient(135deg, var(--primary-color) 50%, transparent 50%);
            background-position: calc(100% - 17px) 50%, calc(100% - 11px) 50%;
            background-size: 6px 6px, 6px 6px;
            background-repeat: no-repeat;
        }

        .meta-control:focus {
            outline: 2px solid color-mix(in srgb, var(--primary-color) 35%, transparent);
            border-color: var(--primary-color) !important;
        }

        .speaker-combobox {
            position: relative;
        }

        .speaker-options {
            display: none;
            position: absolute;
            left: 0;
            right: 0;
            top: calc(100% + 4px);
            max-height: 220px;
            overflow-y: auto;
            background: var(--container-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            box-shadow: 0 10px 24px rgba(0,0,0,0.12);
            z-index: 80;
            padding: 4px;
        }

        .speaker-combobox.open .speaker-options {
            display: block;
        }

        .speaker-option {
            display: block;
            width: 100%;
            border: none;
            background: transparent;
            color: var(--text-color);
            text-align: left;
            padding: 8px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
        }

        .speaker-option:hover,
        .speaker-option.active {
            background: rgba(166, 124, 82, 0.12);
            color: var(--primary-color);
        }

        .speaker-option-empty {
            padding: 8px 10px;
            font-size: 13px;
            opacity: 0.65;
        }

<body data-theme="light" data-mode="view">

<button class="theme-switch no-print" id="theme-btn" onclick="toggleTheme()">切換暗色模式</button>
<button class="view-mode-switch no-print" id="view-mode-btn" onclick="toggleLogViewMode()" style="display:none;">切換分頻道模式</button>


<aside class="toc-panel no-print" id="toc-panel">

        <span>目錄</span>
    </div>

    <div class="toc-list" id="toc-list"></div>
</aside>

<div class="container">
    <h1 class="tool-title no-print">CoC TRPG 團錄整理工具</h1>
    
    <div class="input-section no-print">
        <div class="row"><div class="col-half"><label>劇本名</label><input type="text" id="scenario-name" placeholder="請輸入標題" oninput="saveToLocal()"></div></div>
        <div class="row">
            <div class="col-half">
                <label>簡介圖片 (貼上)</label>
                <div id="image-preview" style="width:100%; height:180px; border:2.5px dashed var(--secondary-color); display:flex; align-items:center; justify-content:center; cursor:pointer; border-radius:15px; background:rgba(0,0,0,0.02);" onclick="document.getElementById('image-input').click()"><span>點擊或貼上</span></div>
                <input type="file" id="image-input" accept="image/*" style="display:none" onchange="handleFileSelect(this)">
            </div>
            <div class="col-half"><label>簡介內容</label><textarea id="intro-text" style="height: 180px;" oninput="saveToLocal()"></textarea></div>

        <div class="row">
            <div class="col-half">

                <div style="display: flex; gap: 10px; align-items: center;">

                    <div class="color-pill">
                        <input type="color" id="kp-color" value="#a67c52" oninput="saveToLocal(); liveUpdateHeader();">
                        <input type="text" class="hex-field" id="kp-color-text" value="#a67c52" style="width:70px !important;" oninput="document.getElementById('kp-color').value=this.value; saveToLocal(); liveUpdateHeader();">

        <details class="config-panel no-print" id="config-panel" style="margin-top: 20px; cursor: pointer;">

                🎨 展開進階顏色與頻道設定

                <div id="channel-options"></div>
                
                <div class="config-title">角色對話顏色調整</div>

    <button class="generate-btn no-print" onclick="firstRender()">輸出團錄預覽</button>
    <div class="action-buttons no-print" id="action-area" style="display:none; align-items: center; gap:15px; margin-top:40px; justify-content: center;">
        <div class="mode-switcher">
            <button class="mode-btn active" id="btn-view" onclick="switchMode('view')">閱覽模式</button>
            <button class="mode-btn" id="btn-edit" onclick="switchMode('edit')">編輯模式</button>
        </div>
        <button onclick="downloadHTML()" class="action-btn">下載HTML</button>
        <button onclick="window.print()" class="action-btn" style="background:#7a8d99;">儲存為 PDF</button>
    </div>

    <div id="output">
        <h1 id="out-title" style="text-align:center; font-size:34px; margin-bottom:40px; font-weight:900;"></h1>
        <div id="out-img" style="text-align: center; margin-bottom: 40px;"></div>
        <div id="out-intro-wrapper" style="margin-bottom:40px; border-left:6px solid var(--primary-color); padding-left:25px;"><p id="out-intro" style="opacity:0.9; white-space:pre-wrap; margin:0;"></p></div>
        <div class="info-bar" id="out-info-bar"></div>
        <div class="channel-tabs no-print" id="channel-tabs" style="display:none;"></div>
        <div id="out-content"></div>
    </div>
</div>

<script>
    let charColorMap = {};
    let detectedCharColorMap = {};
    let manualCharColorMap = {};
    let channelConfigs = {};
    let rawLogData = [];
    let hoList = [];
    let activeIndex = null;
    let moveSourceIndex = null;
    let moveRangeStart = null;
    let moveRangeEnd = null;
    let moveMode = false;
    let editingIndex = null;
    let logViewMode = 'mixed';
    let activeChannelTab = '[main]';
    let logScrollPositions = {};

    let hoverInsertIndex = null;
    let hoverInsertTop = null;
    let hoverBoundaryIndex = null;
    let hoverBoundaryTop = null;

    let pendingPointerEvent = null;
    let pointerRenderQueued = false;
    let colorRenderQueued = false;
    let colorSaveTimer = null;

    let tocEditIndex = null;

    function normalizeImportedText(text) {
        if (typeof text !== 'string') return text;

        text = text
            .replace(/<br\s*\/?>/gi, '\n')
            .replace(/\r\n/g, '\n')
            .replace(/\r/g, '\n')
            .replace(/&nbsp;/g, '')
            .replace(/：[　\s]*/g, '：')
            .replace(/:[　\s]*/g, ':');

        const lines = text.split('\n');

        while (lines.length > 0 && lines[0].trim() === '') {
            lines.shift();
        }

        while (lines.length > 0 && lines[lines.length - 1].trim() === '') {
            lines.pop();
        }

        if (lines.length > 0) {
            lines[0] = lines[0].replace(/^[ \t　]+/, '');
            lines[lines.length - 1] = lines[lines.length - 1].replace(/[ \t　]+$/, '');
        }

        return lines.join('\n');
}

    function extractSystemSpeaker(text) {
        if (typeof text !== 'string') return null;

        const match = text.match(/^[ \t　]*[\[【]([^\]】]{1,50})[\]】][ \t　]*/);
        if (!match) return null;

        const speaker = match[1].trim();
        if (!speaker) return null;

        return {
            name: speaker,
            text: text.slice(match[0].length)
        };
    }

    function queueColorUpdate() {
        if (!colorRenderQueued) {
            colorRenderQueued = true;
            requestAnimationFrame(() => {
                colorRenderQueued = false;
                liveRenderLog();
            });
        }

        clearTimeout(colorSaveTimer);
        colorSaveTimer = setTimeout(saveToLocal, 150);
    }

   

    function deleteLogItem(index) {
    if (confirm("確定要刪除這條訊息嗎？")) {
        rawLogData.splice(index, 1);

        if (activeIndex === index) {
            activeIndex = null;
        } else if (activeIndex > index) {
            activeIndex--;
        }

        if (moveSourceIndex === index) {
            moveSourceIndex = null;
            moveMode = false;
        } else if (moveSourceIndex > index) {
            moveSourceIndex--;
        }

        rerenderKeepViewport();
        saveToLocal();
    }
}

    

    const THEME_PRESETS = {
        light: { kpText: "#4a4a4a", infoBg: "#f9f9f9", otherBg: "#cfdbe3", customBg: "#f9f9f9" },
        dark: { kpText: "#d1d1d1", infoBg: "#2a2a2a", otherBg: "#1e2a33", customBg: "#1e1e1e" }
    };

    window.onload = function() { loadFromLocal(); };

    // 新增：監聽 Ctrl+V 貼上圖片功能
    window.addEventListener('paste', e => {
        // 檢查剪貼簿中是否有圖片
        const item = Array.from(e.clipboardData.items).find(x => x.type.startsWith('image'));
        if (item) {
            const file = item.getAsFile();
            const reader = new FileReader();
            reader.onload = ev => {
                // 將圖片預覽顯示在對應區塊
                document.getElementById('image-preview').innerHTML = `<img src="${ev.target.result}" style="max-width:100%; max-height:100%; border-radius:12px;">`;
                // 同步儲存到本地空間
                saveToLocal();
            };
            reader.readAsDataURL(file);
        }
    });

    function parseCustomMarkdown(text) {
        if (!text) return "";

        let html = text;

        // 先處理引用
        html = html.replace(
            /(?:^|\n)((?:>\s?.*(?:\n|$))+)/g,
            function(match, quoteBlock) {
                const content = quoteBlock
                    .split('\n')
                    .filter(line => line.trim() !== '')
                    .map(line => line.replace(/^>\s?/, ''))
                    .join('<br>');

                return `<div class="md-quote">${content}</div>`;
            }
        );
        
        html = html
            .replace(/#-([\s\S]*?)-#/g, '<span style="font-size: 0.85em; opacity: 0.6;">$1</span>')
            .replace(/#H2-([\s\S]*?)-H2#/g, '<h2 style="margin: 5px 0; font-size: 1.2em;">$1</h2>')
            .replace(/#H1-([\s\S]*?)-H1#/g, '<h1 style="margin: 10px 0; font-size: 1.4em;">$1</h1>')

            // 先處理刪除線，避免和下標衝突
            .replace(/~~([\s\S]*?)~~/g, '<del>$1</del>')

            // 粗體
            .replace(/\*\*([\s\S]*?)\*\*/g, '<b>$1</b>')

            // 斜體
            .replace(/\/\/([\s\S]*?)\/\//g, '<i>$1</i>')

            // 底線
            .replace(/__([\s\S]*?)__/g, '<u>$1</u>')

            // 上標
            .replace(/\^([^^\n]+?)\^/g, '<sup>$1</sup>')

            // 下標（單個 ~，避免吃到 ~~）
            .replace(/~([^~\n]+?)~/g, '<sub>$1</sub>');

        // 最後才換行
        html = html.replace(/\n/g, '<br>');

        return html;
    }

    function escapeAttr(text) {
        return String(text || '')
            .replace(/&/g, '&amp;')
            .replace(/"/g, '&quot;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');
    }

    function saveToLocal() {
        const data = {
            scenarioName: document.getElementById('scenario-name').value,
            introText: document.getElementById('intro-text').value,
            kpName: document.getElementById('kp-name').value,
            hoList,
            theme: document.body.getAttribute('data-theme'),
            mode: document.body.getAttribute('data-mode'),
            logViewMode,
            activeChannelTab,
            logScrollPositions,
            globalShowName: document.getElementById('global-show-name').checked,
            imgSrc: document.getElementById('image-preview').querySelector('img')?.src || '',
            charColorMap, detectedCharColorMap, manualCharColorMap, channelConfigs, rawLogData,
            isOutputVisible: document.getElementById('output').style.display === 'block'
        };
        localStorage.setItem('trpg_log_v44', JSON.stringify(data));
    }

    function loadFromLocal() {
        const saved = localStorage.getItem('trpg_log_v44');
        if (!saved) { addHORow(); return; }
        const data = JSON.parse(saved);
        document.getElementById('scenario-name').value = data.scenarioName || '';
        document.getElementById('intro-text').value = data.introText || '';
        document.getElementById('kp-name').value = data.kpName || '';
        hoList = data.hoList || [];
        renderHOEditor();
        document.body.setAttribute('data-theme', data.theme || 'light');
        logViewMode = data.logViewMode || 'mixed';
        activeChannelTab = data.activeChannelTab || '[main]';
        logScrollPositions = data.logScrollPositions || {};
        updateLogViewModeButtons();
        document.getElementById('global-show-name').checked = (data.globalShowName !== undefined) ? data.globalShowName : true;
        if (data.imgSrc) document.getElementById('image-preview').innerHTML = `<img src="${data.imgSrc}" style="max-width:100%; max-height:100%; border-radius:12px;">`;
        charColorMap = data.charColorMap || {};
        detectedCharColorMap = data.detectedCharColorMap || {};
        manualCharColorMap = data.manualCharColorMap || {};
        channelConfigs = data.channelConfigs || {};
        if (data.rawLogData) {
            rawLogData = data.rawLogData;
            renderConfigPanel();
            if (data.isOutputVisible) {
                document.getElementById('output').style.display = 'block';
                document.getElementById('action-area').style.display = 'flex';
                document.getElementById('view-mode-btn').style.display = 'block';
                switchMode(data.mode || 'view');
                liveUpdateHeader();
                liveRenderLog();
            }
        }
        document.getElementById('theme-btn').innerText = data.theme === 'dark' ? '切換亮色模式' : '切換暗色模式';
    }

    function addHORow() {
        hoList.push({ ho: 'HO' + (hoList.length + 1), pl: '', color: '#a67c52' });
        renderHOEditor(); saveToLocal();
    }

    function renderHOEditor() {
        const container = document.getElementById('ho-editor-list'); container.innerHTML = '';
        hoList.forEach((item, index) => {
            const div = document.createElement('div'); div.className = 'ho-edit-item';
            div.innerHTML = `
                <input type="text" class="ho-tag-input" value="${item.ho}" oninput="updateHOData(${index}, 'ho', this.value)">
                <input type="text" class="pl-name-input" placeholder="PL 名稱" value="${item.pl}" oninput="updateHOData(${index}, 'pl', this.value)">
                <div class="color-pill">
                    <input type="color" value="${item.color}" oninput="updateHOData(${index}, 'color', this.value, 'picker', this)">
                    <input type="text" class="hex-field" value="${item.color}" oninput="updateHOData(${index}, 'color', this.value, 'text', this)">
                </div>
                <button onclick="removeHORow(${index})" style="background:none; border:none; color:#e74c3c; cursor:pointer; font-weight:bold; font-size:20px; flex-shrink:0;">✕</button>`;
            container.appendChild(div);
        });
    }

    function updateHOData(index, key, val, source, el) {
        hoList[index][key] = val;
        if (key === 'color') {
            const parent = el.closest('.color-pill');
            if (source === 'picker') parent.querySelector('.hex-field').value = val;
            else parent.querySelector('input[type="color"]').value = val;
        }
        saveToLocal();
    }
    function removeHORow(index) { hoList.splice(index, 1); renderHOEditor(); saveToLocal(); }

    function switchMode(mode) {
        if (editingIndex !== null) {
            commitEditing({ rerender: false });
        }

        document.body.setAttribute('data-mode', mode);
        document.getElementById('btn-view').classList.toggle('active', mode === 'view');
        document.getElementById('btn-edit').classList.toggle('active', mode === 'edit');

        if (mode !== 'edit') {
            activeIndex = null;
            moveSourceIndex = null;
            moveRangeStart = null;
            moveRangeEnd = null;
            moveMode = false;
            editingIndex = null;
            tocEditIndex = null;
            clearFloatingInsertLine();
            clearFloatingBoundaryHint();
        }

        liveRenderLog();
        saveToLocal();
    }

    function updateLogViewModeButtons() {
        document.body.setAttribute('data-log-view', logViewMode);
        const btn = document.getElementById('view-mode-btn');
        if (btn) {
            btn.innerText = logViewMode === 'channel' ? '切換混合模式' : '切換分頻道模式';
        }
    }

    function getLogViewKey(mode = logViewMode, ch = activeChannelTab) {
        return mode === 'channel' ? `channel:${ch}` : 'mixed';
    }

    function rememberLogScrollPosition() {
        if (document.getElementById('output').style.display !== 'block') return;
        logScrollPositions[getLogViewKey()] = window.scrollY;
    }

    function restoreLogScrollPosition() {
        const savedTop = logScrollPositions[getLogViewKey()];
        if (typeof savedTop !== 'number') return;

        requestAnimationFrame(() => {
            window.scrollTo({
                top: Math.max(0, savedTop),
                behavior: 'auto'
            });
        });
    }

    function setLogViewMode(mode) {
        if (editingIndex !== null) {
            commitEditing({ rerender: false });
        }

        rememberLogScrollPosition();
        logViewMode = mode;
        activeIndex = null;
        tocEditIndex = null;
        ensureActiveChannelTab();
        updateLogViewModeButtons();
        liveRenderLog();
        restoreLogScrollPosition();
        saveToLocal();
    }

    function toggleLogViewMode() {
        setLogViewMode(logViewMode === 'channel' ? 'mixed' : 'channel');
    }

    function setActiveChannelTab(ch) {
        if (editingIndex !== null) {
            commitEditing({ rerender: false });
        }

        rememberLogScrollPosition();
        activeChannelTab = ch;
        activeIndex = null;
        tocEditIndex = null;
        liveRenderLog();
        restoreLogScrollPosition();
        saveToLocal();
    }

    function getChannelLabel(ch) {
        if (ch === '[main]') return '主頻道';
        if (ch === '[info]') return '情報';
        if (ch === '[other]') return '雜談';

        const conf = channelConfigs[ch];
        return conf?.label || ch.replace(/[\[\]]/g, '');
    }

    function getChannelOptionsHTML(selectedCh) {
        const channels = ['[main]', ...Object.keys(channelConfigs).filter(ch => ch !== '[main]')];
        return channels.map(ch => {
            const selected = ch === selectedCh ? 'selected' : '';
            return `<option value="${escapeAttr(ch)}" ${selected}>${getChannelLabel(ch)}</option>`;
        }).join('');
    }

    function getSpeakerNames(selectedName = '') {
        const names = new Set();

        rawLogData.forEach(item => {
            if (!item || item.type === 'image') return;
            if (item.name && item.name !== 'system') names.add(item.name);
        });

        Object.keys(charColorMap).forEach(name => {
            if (name && name !== 'KP（空白）') names.add(name);
        });

        const currentName = selectedName || '';
        if (currentName) names.add(currentName);

        return [...names].sort((a, b) => a.localeCompare(b, 'zh-Hant'));
    }

    function getSpeakerOptionsHTML(index, selectedName = '', query = '') {
        const normalizedQuery = query.trim().toLowerCase();
        const names = getSpeakerNames(selectedName)
            .filter(name => !normalizedQuery || name.toLowerCase().includes(normalizedQuery));

        if (!names.length) {
            const customLabel = query.trim();
            if (customLabel) {
                return `<button type="button" class="speaker-option" onmousedown="event.preventDefault(); chooseSpeaker(${index}, '${escapeAttr(customLabel)}')">使用「${escapeAttr(customLabel)}」</button>`;
            }
            return `<div class="speaker-option-empty">沒有符合的角色</div>`;
        }

        return names.map(name => {
            const active = name === selectedName ? ' active' : '';
            return `<button type="button" class="speaker-option${active}" onmousedown="event.preventDefault(); chooseSpeaker(${index}, '${escapeAttr(name)}')">${escapeAttr(name)}</button>`;
        }).join('');
    }

    function isChannelVisible(ch) {
        if (ch === '[main]') return true;
        const conf = channelConfigs[ch];
        return conf ? conf.checked : true;
    }

    function getChannelSummaries() {
        const map = new Map();

        rawLogData.forEach(item => {
            if (!item || !isChannelVisible(item.ch)) return;

            if (!map.has(item.ch)) {
                map.set(item.ch, {
                    ch: item.ch,
                    label: getChannelLabel(item.ch),
                    count: 0
                });
            }

            map.get(item.ch).count++;
        });

        return [...map.values()];
    }

    function ensureActiveChannelTab() {
        const channels = getChannelSummaries();
        if (!channels.length) {
            activeChannelTab = '[main]';
            return;
        }

        if (!channels.some(channel => channel.ch === activeChannelTab)) {
            activeChannelTab = channels[0].ch;
        }
    }

    function renderChannelTabs() {
        const tabs = document.getElementById('channel-tabs');
        if (!tabs) return;

        if (logViewMode !== 'channel') {
            tabs.style.display = 'none';
            tabs.innerHTML = '';
            return;
        }

        const channels = getChannelSummaries();
        ensureActiveChannelTab();
        tabs.style.display = channels.length ? 'flex' : 'none';
        tabs.innerHTML = '';

        channels.forEach(channel => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = `channel-tab-btn${channel.ch === activeChannelTab ? ' active' : ''}`;
            btn.textContent = channel.label;

            const count = document.createElement('span');
            count.className = 'channel-tab-count';
            count.textContent = channel.count;
            btn.appendChild(count);

            btn.addEventListener('click', () => setActiveChannelTab(channel.ch));
            tabs.appendChild(btn);
        });
    }

    function getRenderableLogEntries() {
        ensureActiveChannelTab();

        return rawLogData
            .map((item, index) => ({ item, index }))
            .filter(({ item }) => {
                if (!item || !isChannelVisible(item.ch)) return false;
                return logViewMode !== 'channel' || item.ch === activeChannelTab;
            });
    }

    function startMoveItem(index) {
        if (document.body.getAttribute('data-mode') !== 'edit') return;

        const range = getMergedRange(index);

        moveSourceIndex = index;
        moveRangeStart = range.start;
        moveRangeEnd = range.end;
        moveMode = true;
        activeIndex = index;

        liveRenderLog();
    }

    function cancelMoveMode() {
        moveSourceIndex = null;
        moveRangeStart = null;
        moveRangeEnd = null;
        moveMode = false;
        clearFloatingInsertLine();
        clearFloatingBoundaryHint();
        rerenderKeepViewport();
    }

    function moveLogItem(targetIndex) {
        if (moveRangeStart === null || moveRangeEnd === null) return;
        if (targetIndex === null || targetIndex === undefined) return;

        const movingItems = rawLogData.slice(moveRangeStart, moveRangeEnd + 1);
        if (!movingItems.length) return;

        rawLogData.splice(moveRangeStart, movingItems.length);

        let adjustedTargetIndex = targetIndex;
        if (moveRangeStart < targetIndex) {
            adjustedTargetIndex -= movingItems.length;
        }

        rawLogData.splice(adjustedTargetIndex, 0, ...movingItems);
        const firstMovedIndex = adjustedTargetIndex;
        const lastMovedIndex = adjustedTargetIndex + movingItems.length - 1;

        // 這組搬過去後，第一塊跟上方是否要融合
        if (firstMovedIndex > 0) {
            rawLogData[firstMovedIndex].splitBefore =
                !canAutoJoin(rawLogData[firstMovedIndex - 1], rawLogData[firstMovedIndex]);
        } else {
            rawLogData[firstMovedIndex].splitBefore = false;
        }

        // 這組搬過去後，下一塊跟這組最後一塊是否要融合
        if (lastMovedIndex < rawLogData.length - 1) {
            rawLogData[lastMovedIndex + 1].splitBefore =
                !canAutoJoin(rawLogData[lastMovedIndex], rawLogData[lastMovedIndex + 1]);
        }

        activeIndex = adjustedTargetIndex;
        moveSourceIndex = null;
        moveRangeStart = null;
        moveRangeEnd = null;
        moveMode = false;
        clearFloatingInsertLine();
        clearFloatingBoundaryHint();

        rerenderKeepViewport();
        saveToLocal();
    }
    function clearFloatingInsertLine() {
        hoverInsertIndex = null;
        hoverInsertTop = null;

        const oldLine = document.querySelector('.floating-insert-line');
        if (oldLine) oldLine.remove();
    }

    function renderFloatingInsertLine() {
        const out = document.getElementById('out-content');
        const oldLine = out.querySelector('.floating-insert-line');
        if (oldLine) oldLine.remove();

        if (!moveMode || hoverInsertIndex === null || hoverInsertTop === null) return;

        const line = document.createElement('div');
        line.className = 'floating-insert-line';
        line.style.top = `${hoverInsertTop}px`;
        line.innerHTML = `<span>插入到此處</span>`;
        out.appendChild(line);
    }

    function updateFloatingInsertFromPointer(e) {
        if (!moveMode) return;

        const out = document.getElementById('out-content');
        const logItem = e.target.closest('.log-item');

        if (!logItem || !out.contains(logItem)) {
            clearFloatingInsertLine();
            return;
        }

        const index = Number(logItem.dataset.index);
        if (Number.isNaN(index)) {
            clearFloatingInsertLine();
            return;
        }

        const rect = logItem.getBoundingClientRect();
        const outRect = out.getBoundingClientRect();
        const midY = rect.top + rect.height / 2;

        let targetIndex;
        let top;

        if (e.clientY < midY) {
            targetIndex = index;
            top = rect.top - outRect.top;
        } else {
            targetIndex = index + 1;
            top = rect.bottom - outRect.top;
        }

        const isInsideMovingGroup =
            moveRangeStart !== null &&
            targetIndex >= moveRangeStart &&
            targetIndex <= moveRangeEnd;

        const isRightAfterMovingGroup =
            moveRangeEnd !== null &&
            targetIndex === moveRangeEnd + 1;

        if (isInsideMovingGroup || isRightAfterMovingGroup) {
            clearFloatingInsertLine();
            return;
        }

        hoverInsertIndex = targetIndex;
        hoverInsertTop = top;
        renderFloatingInsertLine();
    }

    function toggleTheme() { 
        const isDark = document.body.getAttribute('data-theme') === 'dark';
        const newTheme = isDark ? 'light' : 'dark';
        document.body.setAttribute('data-theme', newTheme);
        document.getElementById('theme-btn').innerText = newTheme === 'light' ? '切換暗色模式' : '切換亮色模式';
        updateColorsToTheme(newTheme); saveToLocal();
    }

    function updateColorsToTheme(theme) {
        const preset = THEME_PRESETS[theme];
        if (charColorMap["KP（空白）"]) charColorMap["KP（空白）"] = preset.kpText;
        Object.keys(channelConfigs).forEach(ch => {
            const conf = channelConfigs[ch];
            conf.bgColor = (ch === '[info]') ? preset.infoBg : (ch === '[other]') ? preset.otherBg : preset.customBg;

    function makeEditable(index) {
        if (document.body.getAttribute('data-mode') !== 'edit') return;
        if (moveMode) return;
        if (editingIndex === index) return;

        activeIndex = index;
        editingIndex = index;

        const textNode = document.querySelector(`[data-index="${index}"] .text-content`);
        if (!textNode) {
            editingIndex = null;
            return;
        }

        const cleanContent = rawLogData[index].html || '';

        textNode.innerText = cleanContent;
        textNode.contentEditable = "true";
        textNode.focus();

        textNode.onkeydown = function(e) {
            const key = e.key.toLowerCase();

            if (e.ctrlKey) {
                if (key === 'b') {
                    e.preventDefault();
                    wrapSelection(textNode, '**');
                    return;
                } else if (key === 'i') {
                    e.preventDefault();
                    wrapSelection(textNode, '//');
                    return;
                } else if (key === 'u') {
                    e.preventDefault();
                    wrapSelection(textNode, '__');
                    return;
                } else if (e.shiftKey && key === 'x') {
                    e.preventDefault();
                    wrapSelection(textNode, '~~');
                    return;
                }
            }

            // 可選：Ctrl+Enter 提交
            if (e.ctrlKey && key === 'enter') {
                e.preventDefault();
                commitEditing({ rerender: true, keepViewport: true });
            }
        };
    }

    function focusEditableAfterRender(index) {
        requestAnimationFrame(() => {
            requestAnimationFrame(() => {
                makeEditable(index);
            });
        });
    }

    function wrapSelection(el, wrapper) {
        const selection = window.getSelection();
        if (!selection.rangeCount) return;

        const range = selection.getRangeAt(0);

        // 確保選取範圍在這個編輯區內
        if (!el.contains(range.commonAncestorContainer)) return;

        const selectedText = selection.toString();

        if (selectedText.length > 0) {
            // 有選取文字 → 包起來
            const newText = wrapper + selectedText + wrapper;
            document.execCommand('insertText', false, newText);
        } else {
            // 沒選取 → 插入成對符號
            const newText = wrapper + wrapper;
            document.execCommand('insertText', false, newText);

            // 把游標往中間移
            moveCursorBackward(wrapper.length);
        }
    }

    function moveCursorBackward(count) {
        const selection = window.getSelection();
        if (!selection.rangeCount) return;

        const range = selection.getRangeAt(0);
        range.setStart(range.startContainer, range.startOffset - count);
        range.collapse(true);

        selection.removeAllRanges();
        selection.addRange(range);
    }

            }
            // 處理 [main] 頻道與結局偵測

                const hasKeyWord = /結局|ENDING|END|FIN|通關/i.test(rawMainText);

                if (isKPOrSystem && hasKeyWord && noMarkers && rawMainText.trim() !== "") {
                    renderType = 'ending';

                    contentHTML = `<div class="log-line ending-text" style="color:${displayColor}; text-align:center; font-weight:900; font-size:1.3em; background:rgba(128,128,128,0.08); border-radius:10px; border-top:2px solid ${displayColor}; border-bottom:2px solid ${displayColor}; letter-spacing:3px;">${endingHTML}</div>`;
                } else {

            }
            else if (item.ch === '[other]') {

            }
          
            // 處理其餘區塊頻道 (如：情報、系統、自訂標籤)
            else {

            const editUI = (currentMode === 'edit' && index === activeIndex) ?

    function checkMerging() {
        const items = document.querySelectorAll('.log-item');
        let i = 0;

        while (i < items.length) {
            const item = items[i];
            const block = item.querySelector('.block-styled');

            if (!block) {
                i++;
                continue;
            }

            // --- 1. 找出這一組「合併塊」的範圍 ---
            let group = [item];
            let j = i + 1;
            const currentChannel = block.getAttribute('data-channel');
            const currentBg = block.style.backgroundColor;
            if (currentChannel === '[main]' || currentChannel === '[other]') {
                i++;
                continue;
            }
            

            while (j < items.length) {
                const nextBlock = items[j].querySelector('.block-styled');
                if (nextBlock && 
                    nextBlock.getAttribute('data-channel') === currentChannel && 
                    nextBlock.style.backgroundColor === currentBg &&
                    nextBlock.getAttribute('data-split') !== 'true') {
                    group.push(items[j]);
                    j++;
                } else {
                    break;
                }
            }

            // --- 2. 在這一組中「搜尋」第一個符合條件的角色顏色 ---
            let groupColor = null;
            for (let member of group) {
                const dataIndex = member.dataset.index;
                const logEntry = rawLogData[dataIndex];
                
                // 排除條件：包含 KP (不分大小寫)、system、或是空名字
                const isNotKP = !logEntry.name.toUpperCase().includes("KP");
                const isNotEmpty = logEntry.name.trim() !== "" && logEntry.name !== "system";

                if (isNotKP && isNotEmpty) {
                    groupColor = charColorMap[logEntry.name];
                    break; // 找到第一個角色了，跳出循環
                }
            }

            // --- 3. 決定最終邊框顏色 ---
            // 優先序：頻道自訂邊色 > 剛才搜到的角色色 > 預設咖啡色
            const conf = channelConfigs[rawLogData[item.dataset.index].ch];
            const finalColor = (conf.borderColor && conf.borderColor !== "var(--primary-color)") 
                            ? conf.borderColor 
                            : (groupColor || "var(--primary-color)");

            // --- 4. 統一套用顏色與合併狀態 ---
            group.forEach((member, idx) => {
                const memberBlock = member.querySelector('.block-styled');

                if (idx > 0) {
                    memberBlock.setAttribute('data-merged', 'true');
                    member.classList.add('merged-follow');
                } else {
                    memberBlock.removeAttribute('data-merged');
                    member.classList.remove('merged-follow');
                }

                memberBlock.style.setProperty('border-left-color', finalColor, 'important');
                const infoTag = memberBlock.querySelector('.info-tag');
                if (infoTag) infoTag.style.color = finalColor;
            });

            i = j; // 跳到下一組
        }
    }
