<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <link rel="icon" href="icon.webp" type="image/webp">
    <meta charset="UTF-8">
    <title>CoC TRPG 團錄整理工具</title>
    <style id="dynamic-theme">
        :root {
            --bg-color: #f4f1ea;
            --container-bg: #ffffff;
            --primary-color: #a67c52;
            --secondary-color: #8fa4b3;
            --text-color: #4a4a4a;
            --border-color: #dcdcdc;
            --bar-bg: #f4f1ea;
            --edit-color: #e67e22;
        }

        [data-theme="light"] {
            --bg-color: #f4f1ea;
            --container-bg: #ffffff;
            --primary-color: #a67c52;
            --secondary-color: #8fa4b3;
            --text-color: #4a4a4a;
            --border-color: #dcdcdc;
            --bar-bg: #f4f1ea;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --container-bg: #1e1e1e;
            --primary-color: #c9ad93;
            --secondary-color: #8fa4b3;
            --text-color: #d1d1d1;
            --border-color: #333333;
            --bar-bg: #121212;
        }

        [data-theme="blue"] {
            --bg-color: #F8F9FC;
            --container-bg: #FFFFFF;
            --primary-color: #5B67A2;
            --secondary-color: #7B86AA;
            --text-color: #545051;
            --border-color: #D8DDF2;
            --bar-bg: #EEF1FB;
        }

        [data-theme="brown"] {
            --bg-color: #FCFAF1;
            --container-bg: #FFFDF7;
            --primary-color: #9A6654;
            --secondary-color: #C9B0A8;
            --text-color: #5F403B;
            --border-color: #E4D8CF;
            --bar-bg: #F4EDE4;
        }

        [data-theme="gray"] {
            --bg-color: #F2F2F2;
            --container-bg: #FFFFFF;
            --primary-color: #686868;
            --secondary-color: #917C6E;
            --text-color: #47362B;
            --border-color: #DDDDDD;
            --bar-bg: #ECECEC;
        }

        [data-theme="pastel"] {
            --bg-color: #FCFDFD;
            --container-bg: #FFFFFF;
            --primary-color: #767892;
            --secondary-color: #DFACB8;
            --text-color: #4D5058;
            --border-color: #E7D5E3;
            --bar-bg: #F8EEF3;
        }

        [data-theme="green"] {
            --bg-color: #FCFEF9;
            --container-bg: #FFFFFF;
            --primary-color: #81A76A;
            --secondary-color: #283B51;
            --text-color: #283B51;
            --border-color: #DDE9CB;
            --bar-bg: #F0F8DE;
        }

        [data-theme="softpink"] {
            --bg-color: #FEFCFA;
            --container-bg: #FFFFFF;
            --primary-color: #928C95;
            --secondary-color: #F0BDBD;
            --text-color: #4D5058;
            --border-color: #E6D8D6;
            --bar-bg: #F9EDE9;
        }

        [data-theme="red"] {
            --bg-color: #F7EDEE;
            --container-bg: #FFF9F9;
            --primary-color: #9D1919;
            --secondary-color: #EAAAAD;
            --text-color: #54090C;
            --border-color: #F3BEBE;
            --bar-bg: #FBE4E5;
        }

        [data-theme="contrast"] {
            --bg-color: #FFFFFF;
            --container-bg: #FFFFFF;
            --primary-color: #155B92;
            --secondary-color: #CC4635;
            --text-color: #2C2E3E;
            --border-color: #E8D2C3;
            --bar-bg: #F9DBC4;
        }

        @media print {
            @page {
                margin: 1.2cm;
            }

            html, body {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            body {
                background: white !important;
                color: black !important;
                padding: 0 !important;
            }

            .container {
                box-shadow: none !important;
                max-width: 100% !important;
                padding: 0 8px !important;
                border: none !important;
                background: white !important;
            }

            .no-print,
            .mode-switcher,
            .edit-btn,
            .add-ho-btn,
            .floating-insert-line,
            .floating-boundary-hint,
            .edit-tools {
                display: none !important;
            }

            #output {
                display: block !important;
                border: none !important;
                padding: 0 !important;
            }

            .block-styled {
                break-inside: auto !important;
                page-break-inside: auto !important;
                border-radius: 12px !important;
                padding: 14px 16px !important;
                margin: 6px 0 !important;
            }

            .ending-text,
            .info-bar {
                background: transparent !important;
                border: none !important;
                border-bottom: 1px solid rgba(120, 120, 120, 0.18) !important;
                border-radius: 0 !important;
                box-shadow: none !important;
                padding: 0 0 10px 0 !important;
                margin: 10px 0 18px 0 !important;
                break-inside: avoid !important;
                page-break-inside: avoid !important;
            }
            .md-quote {
                border-left: 3px solid #b8b8b8 !important;
                color: #666 !important;
                font-size: 0.95em !important;
            }

            .main-text {
                line-height: 1.9 !important;
            }
        }

       body {
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 40px 130px;
            margin: 0;
            line-height: 1.8;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            background: var(--container-bg);
            padding: 45px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.05);
        }
        body[data-log-view="channel"] {
            padding-bottom: 96px;
        }
        .theme-switch { position: fixed; top: 20px; right: 20px; padding: 10px 18px; border-radius: 30px; border: 1.5px solid var(--primary-color); background: var(--container-bg); color: var(--primary-color); cursor: pointer; font-weight: bold; z-index: 120; }
        .theme-select { min-width: 136px; appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--primary-color) 50%), linear-gradient(135deg, var(--primary-color) 50%, transparent 50%); background-position: calc(100% - 17px) 50%, calc(100% - 11px) 50%; background-size: 6px 6px, 6px 6px; background-repeat: no-repeat; padding-right: 34px; }
        .view-mode-switch { position: fixed; top: 20px; right: 180px; padding: 10px 18px; border-radius: 30px; border: 1.5px solid var(--primary-color); background: var(--container-bg); color: var(--primary-color); cursor: pointer; font-weight: bold; z-index: 120; }

        .mode-switcher { display: inline-flex; background: #eeeae3; padding: 5px; border-radius: 50px; border: 1px solid var(--border-color); margin-right: 20px; }
        .mode-btn { padding: 10px 25px; border-radius: 25px; border: none; cursor: pointer; font-weight: bold; transition: 0.3s; background: transparent; color: var(--text-color); opacity: 0.6; font-size: 15px; }
        .mode-btn.active { background: var(--primary-color); color: white; opacity: 1; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .channel-tabs {
            display: flex;
            align-items: flex-end;
            gap: 4px;
            flex-wrap: nowrap;
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            overflow-x: auto;
            overflow-y: hidden;
            margin: 0;
            padding: 9px 18px 0;
            border-top: 1px solid var(--border-color);
            background: var(--container-bg);
            box-shadow: 0 -6px 18px rgba(0,0,0,0.08);
            z-index: 118;
        }
        .channel-tab-btn {
            flex: 0 0 auto;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            max-width: min(280px, 58vw);
            min-width: 86px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            border-bottom: none;
            background: var(--bar-bg);
            color: var(--text-color);
            border-radius: 9px 9px 0 0;
            padding: 8px 16px 9px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            opacity: 0.75;
            white-space: nowrap;
            text-overflow: ellipsis;
        }
        .channel-tab-btn[draggable="true"] {
            cursor: grab;
        }
        .channel-tab-btn[draggable="true"]:active {
            cursor: grabbing;
        }
        .channel-tab-btn.dragging {
            opacity: 0.35;
        }
        .channel-tab-btn.drag-over {
            border-color: var(--primary-color);
            box-shadow: 0 -3px 0 var(--primary-color) inset;
        }
        .channel-tab-label {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .channel-tab-btn.active {
            background: var(--container-bg);
            border-color: var(--primary-color);
            color: var(--primary-color);
            opacity: 1;
            box-shadow: 0 -2px 0 var(--primary-color) inset;
        }
        .channel-tab-count {
            flex: 0 0 auto;
            opacity: 0.75;
            margin-left: 0;
            font-weight: 600;
        }

        h1.tool-title { text-align: center; color: var(--primary-color); margin-bottom: 45px; font-size: 32px; letter-spacing: 2px; font-weight: 900; }
        label { display: block; font-weight: bold; margin-bottom: 12px; color: var(--primary-color); font-size: 16px; }
        input[type="text"], textarea { width: 100%; padding: 15px 20px; border: 1.5px solid var(--border-color); border-radius: 12px; box-sizing: border-box; background-color: color-mix(in srgb, var(--container-bg) 92%, var(--bg-color)); color: var(--text-color); margin-bottom: 15px; font-size: 15px; transition: 0.3s; }

        .row { display: flex; gap: 40px; margin-bottom: 25px; align-items: flex-start; width: 100%; }
        .col-half { flex: 1; min-width: 0; }

        .color-pill {
            display: flex;
            align-items: center;
            background: #fff;
            padding: 8px 15px;
            border-radius: 20px; 
            border: 1.2px solid var(--border-color);
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
        }
       
        .config-title {
            font-weight: bold;
            margin-bottom: 12px;
            color: var(--primary-color);
            font-size: 16px;
            display: block;
            padding-bottom: 5px;
            border-bottom: 1px solid rgba(166, 124, 82, 0.2); 
            margin-top: 30px;
        }

        [data-theme="dark"] .color-pill { background: #2a2a2a; }
        input[type="color"] { width: 22px; height: 22px; border: none; cursor: pointer; background: none; padding: 0; border-radius: 50%; overflow: hidden; flex-shrink: 0; }
        input[type="color"]::-webkit-color-swatch { border: none; border-radius: 50%; }
        .hex-field { border: none !important; background: transparent !important; margin-bottom: 0 !important; padding: 0 !important; width: 75px !important; font-family: monospace; font-size: 14px !important; color: inherit !important; font-weight: bold; }

        #ho-editor-list { margin-bottom: 15px; }
        .ho-edit-item { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; }
        .ho-tag-input { width: 80px !important; flex-shrink: 0; text-align: center; }
        .pl-name-input { flex: 1; min-width: 0; }

        .add-ho-btn { background: var(--container-bg); color: var(--primary-color); border: 1.5px solid var(--primary-color); padding: 8px 20px; border-radius: 12px; cursor: pointer; font-weight: bold; font-size: 14px; margin-top: 5px; transition: 0.2s; }

        .channel-item { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; width: 100%; padding: 5px 0; border-bottom: 1px solid rgba(0,0,0,0.05); }
        .channel-name { min-width: 80px; font-weight: bold; color: var(--primary-color); }
        .channel-tag-input { width: 150px !important; margin: 0 !important; padding: 8px 15px !important; }
        .discord-other-setting {
            margin: 14px 0 26px;
            padding: 14px 16px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background: rgba(127, 127, 127, 0.06);
        }
        .discord-other-title {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--primary-color);
            font-weight: 800;
            margin-bottom: 10px;
        }
        .discord-other-dropdown {
            position: relative;
            max-width: 420px;
        }
        .discord-other-toggle {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 10px 14px;
            border: 1.5px solid var(--border-color);
            border-radius: 10px;
            background: var(--container-bg);
            color: var(--text-color);
            cursor: pointer;
            font-weight: 700;
            text-align: left;
        }
        .discord-other-menu {
            display: none;
            position: absolute;
            left: 0;
            right: 0;
            top: calc(100% + 6px);
            z-index: 160;
            max-height: 260px;
            overflow: auto;
            padding: 8px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background: var(--container-bg);
            box-shadow: 0 10px 24px rgba(0,0,0,0.14);
        }
        .discord-other-dropdown.open .discord-other-menu {
            display: block;
        }
        .discord-other-option {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 9px;
            border-radius: 8px;
            cursor: pointer;
            color: var(--text-color);
            font-weight: 600;
        }
        .discord-other-option:hover {
            background: rgba(127, 127, 127, 0.1);
        }
        .discord-other-hint {
            margin-top: 8px;
            font-size: 12px;
            opacity: 0.68;
        }

        #output { margin-top: 60px; padding: 50px; border: 1px solid var(--border-color); background: var(--container-bg); display: none; border-radius: 25px; }
        .log-item {
            position: relative;
            margin: 0;
        }

        /* main 文字段落 */
        .log-item.item-main .log-line {
            margin-top: 0;
            margin-bottom: 1.8em;
        }

       /* 一般 block 和 block 之間，保留清楚間距 */
        .log-item.item-block {
            margin-top: 18px;
        }

        /* 如果是真的合併塊第二塊以後，外層不要再多間距 */
        .log-item.merged-follow {
            margin-top: 0 !important;
        }

        /* main 後接 block，保留更明顯距離 */
        .log-item.after-main.item-block {
            margin-top: 28px;
        }

        /* block 後接 main，保留更明顯距離 */
        .log-item.after-block.item-main {
            margin-top: 28px;
        }

        /* ending 前後也保留明顯距離 */
        .log-item.item-ending {
            margin-top: 28px;
        }

        .log-item.after-ending.item-main,
        .log-item.after-ending.item-block {
            margin-top: 28px;
        }


        .edit-tools{
            position: absolute;
            left: -55px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 8px;
            opacity: 1;
            z-index: 20;
        }

        .edit-tools button{
            width:35px;
            height:35px;
            border-radius:50%;
            color:#e67e22;
            border:1.5px solid var(--border-color);
            background:var(--container-bg);
            cursor:pointer;
            font-size:15px;
            display:flex;
            align-items:center;
            justify-content:center;
            box-shadow:0 2px 5px rgba(0,0,0,0.1);
        }

        /* 編輯模式下，整個區塊可點選 */
        [data-mode="edit"] .log-item {
            cursor: pointer;
        }

        /* 編輯文字時改為 I 字形游標 */
        [data-mode="edit"] .text-content[contenteditable="true"] {
            cursor: text;
            user-select: text;
        }

        /* 被選中的區塊 */
        .log-item.active-item {
            outline: 1.5px dashed var(--primary-color);
            outline-offset: 6px;
            border-radius: 10px;
            background: rgba(166, 124, 82, 0.04);
        }

        .log-item.move-group {
            outline: 1px solid rgba(217, 119, 6, 0.22);
            outline-offset: 2px;
            background: rgba(217, 119, 6, 0.03);
        }

        .log-item.move-source {
            outline: 2px solid rgba(217, 119, 6, 0.45);
            outline-offset: 4px;
            background: rgba(217, 119, 6, 0.05);
        }

        .log-item.move-source::before {
            content: "移動中";
            position: absolute;
            top: -12px;
            left: 12px;
            background: #fff7ed;
            color: #d97706;
            border: 1px solid rgba(217,119,6,0.35);
            border-radius: 999px;
            padding: 2px 10px;
            font-size: 11px;
            font-weight: 700;
            line-height: 1.4;
            z-index: 40;
        }

        .text-content { 
            white-space: pre-wrap;
            outline: none;
            display: block;
            width: 100%;
            font-size: 15px;
        }
            [data-mode="edit"] .text-content:focus { background: rgba(230, 126, 34, 0.05); border-radius: 8px; }

        .log-line { 
            margin-bottom: 1.8em; 
            word-wrap: break-word; 
            font-size: 15px; 
        }

        .log-image-wrap {
            margin: 18px 0 26px;
            text-align: center;
        }

        .log-image {
            max-width: min(100%, 760px);
            max-height: 80vh;
            border-radius: 10px;
            display: inline-block;
        }

        
        .char-name-label { 
            display: block; 
            font-weight: bold; 
            margin-bottom: 2px; 
            font-size: 0.95em; 
        }
        .other-bubble { 
            width: fit-content; 
            max-width: 75%; 
            margin-left: auto; 
            padding: 15px 25px; 
            border-radius: 22px 22px 4px 22px; 
            text-align: right; 
            font-size: 15px; 
            margin-bottom: 1.6em; 
            border-right: 6px solid var(--secondary-color); 
            background: var(--bar-bg); 
        }
        .block-styled { 
            padding: 30px 35px; 
            border-radius: 15px; 
            margin: 0; 
            border-left: 10px solid ; 
            transition: none; 
        }
        .info-tag { 
            font-weight: 700; 
            color: var(--primary-color); 
            font-size: 13px; 
            display: block; 
            margin-bottom: 12px; 
            letter-spacing: 1px; }

        /* 當區塊被標記為合併時：去掉上方圓角、去掉上方邊框、去掉上方間距 */
        .block-styled[data-merged="true"] {
            margin-top: 0 !important;
            border-top-left-radius: 0 !important;
            border-top-right-radius: 0 !important;
            border-top: none !important;
            padding-top: 1.8em !important; /* 縮短內部頂部間距 */
        }

        /* 隱藏合併區塊內重複的標籤（例如：情報、系統） */
        .block-styled[data-merged="true"] .info-tag {
            display: none;
        }

        /* 處理被合併者的「前一個元素」：去掉下方圓角、去掉下方間距 */
        .log-item:has(+ .log-item .block-styled[data-merged="true"]) .block-styled {
            border-bottom-left-radius: 0 !important;
            border-bottom-right-radius: 0 !important;
            margin-bottom: 0 !important;
            padding-bottom: 0 !important;
        }

        /* 讓資訊列的間距與字級完全貼合內文 */
        .info-bar {
           padding: 10px 0;    /* 縮小上下內距 */
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 40px; /* 這就是分隔線上的那行空白感 */
            margin-bottom: 40px;  /* 分隔線下方的空白，與內文區隔 */
        }

        .info-line {
            display: flex;
            align-items: baseline; 
            margin-bottom: 4px !important; 
            font-size: 15px !important; /* 調整成跟內文一樣大 */
            line-height: 1.6 !important;
            font-weight: normal;
        }

        .info-line strong {
            min-width: 50px; /* 標籤寬度 */
            margin-right: 15px;
            flex-shrink: 0;
            font-weight: 400;
        }

        

        .file-upload-wrapper { text-align: center; padding: 55px 30px; border: 2.5px dashed var(--border-color); border-radius: 20px; background: rgba(0,0,0,0.01); margin: 40px 0; transition: 0.3s; }
        .file-upload-wrapper label { font-size: 18px; margin-bottom: 25px; color: var(--primary-color); opacity: 0.9; }

        .generate-btn { background-color: var(--primary-color); color: white; border: none; padding: 18px; border-radius: 15px; cursor: pointer; font-size: 18px; font-weight: bold; width: 100%; margin-top: 10px; transition: 0.3s; box-shadow: 0 6px 15px rgba(166, 124, 82, 0.2); }
        .action-btn { background: #8fa4b3; color: white; padding: 15px 30px; border: none; border-radius: 15px; cursor: pointer; font-weight: bold; font-size: 16px; height: 60px; transition: 0.3s; display: flex; align-items: center; justify-content: center; text-align: center; line-height: 1.8; }
        
        .floating-boundary-hint {
            position: absolute;
            left: 0;
            right: 0;
            height: 0;
            z-index: 36;
            pointer-events: none;
        }

        .floating-boundary-hint::before {
            content: "";
            position: absolute;
            left: 18px;
            right: 18px;
            top: 0;
            border-top: 1px dashed #d97706;
            opacity: 0.55;
        }

        .floating-boundary-hint button {
            position: absolute;
            left: 50%;
            top: 0;
            transform: translate(-50%, -50%);
            background: #fff7ed;
            color: #d97706;
            border: 1px solid rgba(217,119,6,0.35);
            border-radius: 999px;
            padding: 1px 10px;
            font-size: 11px;
            line-height: 1.5;
            cursor: pointer;
            pointer-events: auto;
        }
        
        #out-content {
            position: relative;
        }


        .floating-insert-line {
            position: absolute;
            left: 0;
            right: 0;
            height: 0;
            z-index: 35;
            pointer-events: none;
        }

        .floating-insert-line::before {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            border-top: 2px dashed var(--primary-color);
            opacity: 0.95;
        }

        .floating-insert-line span {
            position: absolute;
            left: 50%;
            top: 0;
            transform: translate(-50%, -50%);
            background: var(--container-bg);
            padding: 0 10px;
            font-size: 12px;
            color: var(--primary-color);

    function normalizeImportedText(text) {
        if (typeof text !== 'string') return text;

        text = text
            .replace(/<br\s*\/?>/gi, '\n')
            .replace(/\r\n/g, '\n')
            .replace(/\r/g, '\n')
            .replace(/&nbsp;/g, '')
            .replace(/：[　\s]*/g, '：')
            .replace(/:[　\s]*/g, ':');

        const lines = text.split('\n');

        while (lines.length > 0 && lines[0].trim() === '') {
            lines.shift();
        }

        while (lines.length > 0 && lines[lines.length - 1].trim() === '') {
            lines.pop();
        }

        if (lines.length > 0) {
            lines[0] = lines[0].replace(/^[ \t　]+/, '');
            lines[lines.length - 1] = lines[lines.length - 1].replace(/[ \t　]+$/, '');
        }

        return lines.join('\n');
}

    function extractSystemSpeaker(text) {
        if (typeof text !== 'string') return null;

        const match = text.match(/^[ \t　]*[\[【]([^\]】]{1,50})[\]】][ \t　]*/);
        if (!match) return null;

        const speaker = match[1].trim();
        if (!speaker) return null;

        return {
            name: speaker,
            text: text.slice(match[0].length)
        };
    }

    function queueColorUpdate() {
        if (!colorRenderQueued) {
            colorRenderQueued = true;
            requestAnimationFrame(() => {
                colorRenderQueued = false;
                liveRenderLog();
            });
        }

        clearTimeout(colorSaveTimer);
        colorSaveTimer = setTimeout(saveToLocal, 150);
    }

   

    function deleteLogItem(index) {
    if (confirm("確定要刪除這條訊息嗎？")) {
        rawLogData.splice(index, 1);

        if (activeIndex === index) {
            activeIndex = null;
        } else if (activeIndex > index) {
            activeIndex--;
        }

        if (moveSourceIndex === index) {
            moveSourceIndex = null;
            moveMode = false;
        } else if (moveSourceIndex > index) {
            moveSourceIndex--;
        }

        rerenderKeepViewport();
        saveToLocal({ rawLogChanged: true });
    }
}

        softpink: { kpText: "#4D5058", infoBg: "#FAEEE9", otherBg: "#F4D7D7", customBg: "#FFFFFF" },
        red: { kpText: "#54090C", infoBg: "#FBE7E8", otherBg: "#F4D1D2", customBg: "#FFF9F9" },
        contrast: { kpText: "#2C2E3E", infoBg: "#F9DBC4", otherBg: "#F4E0D2", customBg: "#FFFFFF" }
    };

    window.onload = async function() {
        await loadFromLocal();
    };

    // 新增：監聽 Ctrl+V 貼上圖片功能
    window.addEventListener('paste', e => {
        // 檢查剪貼簿中是否有圖片
        const item = Array.from(e.clipboardData.items).find(x => x.type.startsWith('image'));
        if (item) {
            const file = item.getAsFile();
            const reader = new FileReader();
            reader.onload = ev => {
                // 將圖片預覽顯示在對應區塊
                document.getElementById('image-preview').innerHTML = `<img src="${ev.target.result}" style="max-width:100%; max-height:100%; border-radius:12px;">`;
                // 同步儲存到本地空間
                saveToLocal({ introImageChanged: true });
            };
            reader.readAsDataURL(file);
        }
    });

    function parseCustomMarkdownLegacy(text) {
        if (!text) return "";

        let html = text;

        // 先處理引用
        html = html.replace(
            /(?:^|\n)((?:>\s?.*(?:\n|$))+)/g,
            function(match, quoteBlock) {
                const content = quoteBlock
                    .split('\n')
                    .filter(line => line.trim() !== '')
                    .map(line => line.replace(/^>\s?/, ''))
                    .join('<br>');

                return `<div class="md-quote">${content}</div>`;
            }
        );
        
        html = html
            .replace(/#-([\s\S]*?)-#/g, '<span style="font-size: 0.85em; opacity: 0.6;">$1</span>')
            .replace(/#H2-([\s\S]*?)-H2#/g, '<h2 style="margin: 5px 0; font-size: 1.2em;">$1</h2>')
            .replace(/#H1-([\s\S]*?)-H1#/g, '<h1 style="margin: 10px 0; font-size: 1.4em;">$1</h1>')

            // 先處理刪除線，避免和下標衝突
            .replace(/~~([\s\S]*?)~~/g, '<del>$1</del>')

            // 粗體
            .replace(/\*\*([\s\S]*?)\*\*/g, '<b>$1</b>')

            // 斜體
            .replace(/\/\/([\s\S]*?)\/\//g, '<i>$1</i>')

            // 底線
            .replace(/__([\s\S]*?)__/g, '<u>$1</u>')

            // 上標
            .replace(/\^([^^\n]+?)\^/g, '<sup>$1</sup>')

            // 下標（單個 ~，避免吃到 ~~）
            .replace(/~([^~\n]+?)~/g, '<sub>$1</sub>');

        // 最後才換行
        html = html.replace(/\n/g, '<br>');

        return html;
    }

    function escapeHtml(text) {
        return String(text || '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function renderMarkdownLists(text) {
        const lines = String(text || '').split('\n');
        const out = [];
        let inList = false;
        let inSubList = false;
        let openTopItem = false;

        function closeList() {
            if (!inList) return;
            if (inSubList) {
                out.push('</ul>');
                inSubList = false;
            }
            if (openTopItem) {
                out.push('</li>');
                openTopItem = false;
            }
            out.push('</ul>');
            inList = false;
        }

        lines.forEach(line => {
            const match = line.match(/^(\s{0,2})([-*])\s+(.+)$/);
            if (!match) {
                closeList();
                out.push(line);
                return;
            }

            const level = match[1].length >= 2 ? 1 : 0;
            const content = match[3];

            if (level === 0) {
                if (!inList) {
                    out.push('<ul class="md-list">');
                    inList = true;
                }
                if (inSubList) {
                    out.push('</ul>');
                    inSubList = false;
                }
                if (openTopItem) out.push('</li>');
                out.push(`<li>${content}`);
                openTopItem = true;
                return;
            }

            if (!inList) {
                out.push('<ul class="md-list">');
                inList = true;
                out.push('<li>');
                openTopItem = true;
            }
            if (!inSubList) {
                out.push('<ul class="md-list">');
                inSubList = true;
            }
            out.push(`<li>${content}</li>`);
        });

        closeList();
        return out.join('\n');
    }

    function parseCustomMarkdown(text) {
        if (!text) return "";

        const protectedParts = [];
        const protect = html => {
            const token = `@@MD_PROTECTED_${protectedParts.length}@@`;
            protectedParts.push(html);
            return token;
        };

        let html = String(text);

        html = html.replace(/```([\s\S]*?)```/g, function(match, code) {
            code = code.replace(/^\n/, '').replace(/\n$/, '');
            return protect(`<pre class="md-code-block"><code>${escapeHtml(code)}</code></pre>`);
        });

        html = html.replace(/`([^`\n]+?)`/g, function(match, code) {
            return protect(`<code class="md-inline-code">${escapeHtml(code)}</code>`);
        });

        html = html
            .replace(/#-([\s\S]*?)-#/g, '<span style="font-size: 0.85em; opacity: 0.6;">$1</span>')
            .replace(/#H3-([\s\S]*?)-H3#/g, '<h3 style="margin: 5px 0; font-size: 1.08em;">$1</h3>')
            .replace(/#H2-([\s\S]*?)-H2#/g, '<h2 style="margin: 5px 0; font-size: 1.2em;">$1</h2>')
            .replace(/#H1-([\s\S]*?)-H1#/g, '<h1 style="margin: 10px 0; font-size: 1.4em;">$1</h1>');

        html = html.replace(
            /(?:^|\n)((?:>\s?.*(?:\n|$))+)/g,
            function(match, quoteBlock) {
                const prefix = match.startsWith('\n') ? '\n' : '';
                const content = quoteBlock
                    .split('\n')
                    .filter(line => line.trim() !== '')
                    .map(line => line.replace(/^>\s?/, ''))
                    .join('<br>');

                return `${prefix}<div class="md-quote">${content}</div>`;
            }
        );

        html = renderMarkdownLists(html);

        html = html
            .replace(/~~([\s\S]*?)~~/g, '<del>$1</del>')
            .replace(/\*\*([\s\S]*?)\*\*/g, '<b>$1</b>')
            .replace(/\/\/([\s\S]*?)\/\//g, '<i>$1</i>')
            .replace(/__([\s\S]*?)__/g, '<u>$1</u>')
            .replace(/\^([^^\n]+?)\^/g, '<sup>$1</sup>')
            .replace(/~([^~\n]+?)~/g, '<sub>$1</sub>');

        html = html.replace(/\n/g, '<br>');
        protectedParts.forEach((part, index) => {
            html = html.replaceAll(`@@MD_PROTECTED_${index}@@`, part);
        });

        return html;
    }

    function discordHtmlToCustomMarkdown(contentEl) {
        if (!contentEl) return "";

        const inlineTags = new Set(['STRONG', 'B', 'EM', 'I', 'U', 'S', 'DEL', 'CODE', 'SPAN', 'A']);

        function childrenToMarkdown(node) {
            return Array.from(node.childNodes).map(nodeToMarkdown).join('');
        }

        function blockText(text) {
            return String(text || '').replace(/\n{3,}/g, '\n\n').trim();
        }

        function listToMarkdown(listEl, depth = 0) {
            return Array.from(listEl.children)
                .filter(child => child.tagName === 'LI')
                .map(li => {
                    const nested = Array.from(li.children).filter(child => child.tagName === 'UL');
                    const own = Array.from(li.childNodes)
                        .filter(child => !(child.nodeType === Node.ELEMENT_NODE && child.tagName === 'UL'))
                        .map(nodeToMarkdown)
                        .join('')
                        .trim();
                    const prefix = `${'  '.repeat(depth)}- `;
                    const nestedText = nested.map(child => listToMarkdown(child, depth + 1)).filter(Boolean).join('\n');
                    return nestedText ? `${prefix}${own}\n${nestedText}` : `${prefix}${own}`;
                })
                .join('\n');
        }

        function quoteToMarkdown(node) {
            const content = node.querySelector('.chatlog__markdown-quote-content') || node;
            return blockText(childrenToMarkdown(content))
                .split('\n')
                .map(line => `> ${line}`)
                .join('\n');
        }

        function nodeToMarkdown(node) {
            if (node.nodeType === Node.TEXT_NODE) {
                const text = node.nodeValue || '';
                return /^\s*\(edited\)\s*$/i.test(text) ? '' : text;
            }
            if (node.nodeType !== Node.ELEMENT_NODE) return '';

            const tag = node.tagName;
            const cls = node.classList || { contains: () => false };

            if (cls.contains('chatlog__edited-timestamp')) return '';
            if (tag === 'BR') return '\n';
            if (cls.contains('chatlog__markdown-quote')) return `\n${quoteToMarkdown(node)}\n`;
            if (tag === 'H1') return `\n#H1-${blockText(childrenToMarkdown(node))}-H1#\n`;
            if (tag === 'H2') return `\n#H2-${blockText(childrenToMarkdown(node))}-H2#\n`;
            if (tag === 'H3') return `\n#H3-${blockText(childrenToMarkdown(node))}-H3#\n`;
            if (tag === 'PRE' || cls.contains('chatlog__markdown-pre--multiline')) {
                return `\n\`\`\`\n${node.textContent.replace(/\n$/, '')}\n\`\`\`\n`;
            }
            if (tag === 'CODE' || cls.contains('chatlog__markdown-pre--inline')) return `\`${node.textContent}\``;
            if (tag === 'STRONG' || tag === 'B') return `**${childrenToMarkdown(node)}**`;
            if (tag === 'EM' || tag === 'I') return `//${childrenToMarkdown(node)}//`;
            if (tag === 'U') return `__${childrenToMarkdown(node)}__`;
            if (tag === 'S' || tag === 'DEL') return `~~${childrenToMarkdown(node)}~~`;
            if (tag === 'UL') return `\n${listToMarkdown(node)}\n`;
            if (tag === 'LI') return childrenToMarkdown(node);
            if (cls.contains('chatlog__markdown-mention') || cls.contains('chatlog__markdown-spoiler')) return node.textContent || '';

            const content = childrenToMarkdown(node);
            if (tag === 'P' || tag === 'DIV') return inlineTags.has(tag) ? content : `${content}\n`;
            return content;
        }

        let markdown = childrenToMarkdown(contentEl);
        const protectedMarkdown = [];
        markdown = markdown.replace(/```[\s\S]*?```/g, block => {
            const token = `@@DISCORD_MD_PROTECTED_${protectedMarkdown.length}@@`;
            protectedMarkdown.push(block);
            return token;
        });
        markdown = markdown
            .replace(/^\s*###\s+(.+)$/gm, '#H3-$1-H3#')
            .replace(/^\s*##\s+(.+)$/gm, '#H2-$1-H2#')
            .replace(/^\s*#\s+(.+)$/gm, '#H1-$1-H1#')
            .replace(/^\s*-#\s*(.+)$/gm, '#-$1-#')
            .replace(/[ \t]+\n/g, '\n')
            .replace(/\n{3,}/g, '\n\n')
            .trim();
        protectedMarkdown.forEach((block, index) => {
            markdown = markdown.replaceAll(`@@DISCORD_MD_PROTECTED_${index}@@`, block);
        });

        return markdown;
    }

    function sortLogItems(items) {
        const hasSortableTimestamp = item => item.timestamp !== null && item.timestamp !== undefined && Number.isFinite(Number(item.timestamp));

        return [...(items || [])]
            .map((item, index) => ({ item, index }))
            .sort((a, b) => {
                const aHasTime = hasSortableTimestamp(a.item);
                const bHasTime = hasSortableTimestamp(b.item);
                if (!aHasTime && !bHasTime) return a.index - b.index;
                if (!aHasTime) return 1;
                if (!bHasTime) return -1;

                const timeDiff = Number(a.item.timestamp) - Number(b.item.timestamp);
                if (timeDiff !== 0) return timeDiff;

                const idDiff = String(a.item.messageId || '').localeCompare(String(b.item.messageId || ''), undefined, { numeric: true });
                if (idDiff !== 0) return idDiff;

                const aSub = Number.isFinite(Number(a.item.subOrder)) ? Number(a.item.subOrder) : (a.item.type === 'image' ? 1 : 0);
                const bSub = Number.isFinite(Number(b.item.subOrder)) ? Number(b.item.subOrder) : (b.item.type === 'image' ? 1 : 0);
                const subDiff = aSub - bSub;
                return subDiff !== 0 ? subDiff : a.index - b.index;
            })
            .map(entry => entry.item);
    }

    function escapeAttr(text) {
        return String(text || '')
            .replace(/&/g, '&amp;')
            .replace(/"/g, '&quot;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');
    }

    function openLogDB() {
        return new Promise((resolve, reject) => {
            const request = indexedDB.open(DB_NAME, DB_VERSION);
            request.onupgradeneeded = event => {
                const db = event.target.result;
                if (!db.objectStoreNames.contains(LOG_STORE_NAME)) {
                    db.createObjectStore(LOG_STORE_NAME, { keyPath: 'id' });
                }
            };
            request.onsuccess = () => resolve(request.result);
            request.onerror = () => reject(request.error);
        });
    }

    async function saveRawLogDataToIndexedDB(data) {
        const db = await openLogDB();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(LOG_STORE_NAME, 'readwrite');
            tx.objectStore(LOG_STORE_NAME).put({
                id: 'current',
                rawLogData: Array.isArray(data) ? data : [],
                updatedAt: Date.now()
            });
            tx.oncomplete = () => { db.close(); resolve(); };
            tx.onerror = () => { const error = tx.error; db.close(); reject(error); };
        });
    }

    async function loadRawLogDataFromIndexedDB() {
        const db = await openLogDB();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(LOG_STORE_NAME, 'readonly');
            const request = tx.objectStore(LOG_STORE_NAME).get('current');
            request.onsuccess = () => { db.close(); resolve(request.result?.rawLogData || []); };
            request.onerror = () => { const error = request.error || tx.error; db.close(); reject(error); };
        });
    }

    async function clearRawLogDataFromIndexedDB() {
        const db = await openLogDB();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(LOG_STORE_NAME, 'readwrite');
            tx.objectStore(LOG_STORE_NAME).delete('current');
            tx.oncomplete = () => { db.close(); resolve(); };
            tx.onerror = () => { const error = tx.error; db.close(); reject(error); };
        });
    }

    async function saveIntroImageToIndexedDB(imgSrc) {
        const db = await openLogDB();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(LOG_STORE_NAME, 'readwrite');
            const store = tx.objectStore(LOG_STORE_NAME);
            if (imgSrc) {
                store.put({ id: 'introImage', imgSrc, updatedAt: Date.now() });
            } else {
                store.delete('introImage');
            }
            tx.oncomplete = () => { db.close(); resolve(); };
            tx.onerror = () => { const error = tx.error; db.close(); reject(error); };
        });
    }

    async function loadIntroImageFromIndexedDB() {
        const db = await openLogDB();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(LOG_STORE_NAME, 'readonly');
            const request = tx.objectStore(LOG_STORE_NAME).get('introImage');
            request.onsuccess = () => { db.close(); resolve(request.result?.imgSrc || ''); };
            request.onerror = () => { const error = request.error || tx.error; db.close(); reject(error); };
        });
    }

    function saveToLocal(options = {}) {
        if (options.rawLogChanged) markRawLogDirty();
        if (options.introImageChanged) markIntroImageDirty();
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(getSettingsData()));
        } catch (err) {
            console.error('localStorage settings save failed:', err);
            if (!localStorageQuotaWarned) {
                localStorageQuotaWarned = true;
                alert(
                    '瀏覽器暫存空間不足，部分設定可能無法自動保存。\n\n' +
                    '目前畫面上的資料仍可使用，建議先下載 HTML 或儲存為 PDF。'
                );
            }
        }
        queueRawLogSave();
        queueIntroImageSave();
    }

    async function loadFromLocal() {
        let saved = localStorage.getItem(STORAGE_KEY);
        let isLegacyData = false;
        if (!saved) {
            saved = localStorage.getItem(LEGACY_STORAGE_KEY);
            isLegacyData = !!saved;
        }
        if (!saved) { addHORow(); return; }

        let data = {};
        try {
            data = JSON.parse(saved);
        } catch (err) {
            console.error('Saved settings parse failed:', err);
            addHORow();
            return;
        }
        document.getElementById('scenario-name').value = data.scenarioName || '';
        document.getElementById('intro-text').value = data.introText || '';
        document.getElementById('kp-name').value = data.kpName || '';
        hoList = data.hoList || [];
        renderHOEditor();
        document.body.setAttribute('data-theme', getValidTheme(data.theme));
        logViewMode = data.logViewMode || 'mixed';
        activeChannelTab = data.activeChannelTab || '[main]';
        channelOrder = Array.isArray(data.channelOrder) ? data.channelOrder : [];
        logScrollPositions = data.logScrollPositions || {};
        updateLogViewModeButtons();
        document.getElementById('global-show-name').checked = (data.globalShowName !== undefined) ? data.globalShowName : true;
        globalTimeDisplayMode = data.globalTimeDisplayMode || ((data.globalShowTime !== undefined && data.globalShowTime) ? 'all' : 'none');
        globalShowTime = globalTimeDisplayMode !== 'none';
        const globalShowTimeEl = document.getElementById('global-show-time');
        if (globalShowTimeEl) globalShowTimeEl.checked = globalShowTime;
        charColorMap = data.charColorMap || {};
        detectedCharColorMap = data.detectedCharColorMap || {};
        manualCharColorMap = data.manualCharColorMap || {};
        charNameVisibilityMap = data.charNameVisibilityMap || {};
        channelConfigs = data.channelConfigs || {};
        discordOtherChannels = Array.isArray(data.discordOtherChannels) ? data.discordOtherChannels : [];

        let loadedIntroImageSrc = data.imgSrc || '';
        if (data.imgSrc?.startsWith?.('data:image/')) {
            try {
                await saveIntroImageToIndexedDB(data.imgSrc);
            } catch (err) {
                console.error('Legacy intro image migration failed:', err);
            }
        } else {
            try {
                loadedIntroImageSrc = await loadIntroImageFromIndexedDB() || loadedIntroImageSrc;
            } catch (err) {
                console.error('IndexedDB intro image load failed:', err);
            }
        }
        if (loadedIntroImageSrc) {
            document.getElementById('image-preview').innerHTML = `<img src="${loadedIntroImageSrc}" style="max-width:100%; max-height:100%; border-radius:12px;">`;
        }

        let loadedRawLogData = [];
        if (isLegacyData && Array.isArray(data.rawLogData)) {
            loadedRawLogData = data.rawLogData;
            try {
                await saveRawLogDataToIndexedDB(loadedRawLogData);
                saveToLocal();
            } catch (err) {
                console.error('Legacy rawLogData migration failed:', err);
            }
        } else {
            try {
                loadedRawLogData = await loadRawLogDataFromIndexedDB();
            } catch (err) {
                console.error('IndexedDB rawLogData load failed:', err);
            }
        }

        if (Array.isArray(loadedRawLogData) && loadedRawLogData.length) {
            rawLogData = loadedRawLogData;
            renderConfigPanel();
            if (data.isOutputVisible) {
                document.getElementById('output').style.display = 'block';
                document.getElementById('action-area').style.display = 'flex';
                document.getElementById('view-mode-btn').style.display = 'block';
            }
            switchMode(data.mode || 'view');
            liveUpdateHeader();
            liveRenderLog();
        }
        updateThemeSelect();
    }

    function addHORow() {
        hoList.push({ ho: 'HO' + (hoList.length + 1), pl: '', color: '#a67c52' });

    function renderHOEditor() {

            div.innerHTML = `

                </div>

    function updateHOData(index, key, val, source, el) {
        hoList[index][key] = val;
        if (key === 'color') {
            const parent = el.closest('.color-pill');
            if (source === 'picker') parent.querySelector('.hex-field').value = val;
            else parent.querySelector('input[type="color"]').value = val;

    function removeHORow(index) { hoList.splice(index, 1); renderHOEditor(); saveToLocal(); }

    function switchMode(mode) {
        if (editingIndex !== null) {
            commitEditing({ rerender: false });
        }

        document.body.setAttribute('data-mode', mode);
        document.getElementById('btn-view').classList.toggle('active', mode === 'view');
        document.getElementById('btn-edit').classList.toggle('active', mode === 'edit');

        if (mode !== 'edit') {
            activeIndex = null;
            moveSourceIndex = null;
            moveRangeStart = null;
            moveRangeEnd = null;
            moveMode = false;
            editingIndex = null;
            tocEditIndex = null;
            clearFloatingInsertLine();
            clearFloatingBoundaryHint();
        }

        liveRenderLog();
        saveToLocal();
    }

    function updateLogViewModeButtons() {
        document.body.setAttribute('data-log-view', logViewMode);
        const btn = document.getElementById('view-mode-btn');
        if (btn) {
            btn.innerText = logViewMode === 'channel' ? '切換混合模式' : '切換分頻道模式';
        }
    }

    function getLogViewKey(mode = logViewMode, ch = activeChannelTab) {
        return mode === 'channel' ? `channel:${ch}` : 'mixed';
    }

    function rememberLogScrollPosition() {
        if (document.getElementById('output').style.display !== 'block') return;
        logScrollPositions[getLogViewKey()] = window.scrollY;
    }

    function restoreLogScrollPosition() {
        const savedTop = logScrollPositions[getLogViewKey()];
        if (typeof savedTop !== 'number') return;

        requestAnimationFrame(() => {
            window.scrollTo({
                top: Math.max(0, savedTop),
                behavior: 'auto'
            });
        });
    }

    function setLogViewMode(mode) {
        if (editingIndex !== null) {
            commitEditing({ rerender: false });
        }

        rememberLogScrollPosition();
        logViewMode = mode;
        activeIndex = null;
        tocEditIndex = null;
        ensureActiveChannelTab();
        updateLogViewModeButtons();
        liveRenderLog();
        restoreLogScrollPosition();
        saveToLocal();
    }

    function toggleLogViewMode() {
        setLogViewMode(logViewMode === 'channel' ? 'mixed' : 'channel');
    }

    function setActiveChannelTab(ch) {
        if (editingIndex !== null) {
            commitEditing({ rerender: false });
        }

        rememberLogScrollPosition();
        activeChannelTab = ch;
        activeIndex = null;
        tocEditIndex = null;
        liveRenderLog();
        restoreLogScrollPosition();
        saveToLocal();
    }

    function getChannelLabel(ch) {
        if (ch === '[main]') return '主頻道';
        if (ch === '[info]') return '情報';
        if (ch === '[other]') return '雜談';

        const conf = channelConfigs[ch];
        return conf?.label || ch.replace(/[\[\]]/g, '');
    }

    function getKnownChannelKeys() {
        const keys = [];
        const seen = new Set();
        const add = ch => {
            if (!ch || seen.has(ch)) return;
            seen.add(ch);
            keys.push(ch);
        };

        rawLogData.forEach(item => add(item?.ch));
        Object.keys(channelConfigs).forEach(add);
        if (!keys.length) add('[main]');
        return keys;
    }

    function normalizeChannelOrder() {
        const knownKeys = getKnownChannelKeys();
        const knownSet = new Set(knownKeys);
        channelOrder = channelOrder.filter(ch => knownSet.has(ch));

        knownKeys.forEach(ch => {
            if (!channelOrder.includes(ch)) channelOrder.push(ch);
        });

        return channelOrder;
    }

    function sortChannelsByUserOrder(keys) {
        const order = normalizeChannelOrder();
        const orderIndex = new Map(order.map((ch, index) => [ch, index]));

        return [...keys].sort((a, b) => {
            const ai = orderIndex.has(a) ? orderIndex.get(a) : Number.MAX_SAFE_INTEGER;
            const bi = orderIndex.has(b) ? orderIndex.get(b) : Number.MAX_SAFE_INTEGER;
            return ai - bi;
        });
    }

    function setDiscordChannelOrderByFirstMessageTime() {
        const channelFirsts = new Map();

        rawLogData.forEach((item, index) => {
            if (!item || item.source !== 'discord' || !item.ch) return;

            const timestamp = Number(item.timestamp);
            const hasTime = item.timestamp !== null && item.timestamp !== undefined && Number.isFinite(timestamp);
            const current = channelFirsts.get(item.ch);

            if (!current) {
                channelFirsts.set(item.ch, {
                    ch: item.ch,
                    timestamp: hasTime ? timestamp : null,
                    firstIndex: index
                });
                return;
            }

            if (hasTime && (current.timestamp === null || timestamp < current.timestamp)) {
                current.timestamp = timestamp;
                current.firstIndex = index;
            }
        });

        channelOrder = [...channelFirsts.values()]
            .sort((a, b) => {
                const aHasTime = a.timestamp !== null;
                const bHasTime = b.timestamp !== null;
                if (aHasTime && bHasTime && a.timestamp !== b.timestamp) return a.timestamp - b.timestamp;
                if (aHasTime !== bHasTime) return aHasTime ? -1 : 1;
                return a.firstIndex - b.firstIndex;
            })
            .map(entry => entry.ch);

        normalizeChannelOrder();
    }

    function getChannelOptionsHTML(selectedCh) {
        const keys = new Set(['[main]', ...Object.keys(channelConfigs)]);
        rawLogData.forEach(item => { if (item?.ch) keys.add(item.ch); });
        const channels = sortChannelsByUserOrder([...keys]);
        return channels.map(ch => {
            const selected = ch === selectedCh ? 'selected' : '';
            return `<option value="${escapeAttr(ch)}" ${selected}>${getChannelLabel(ch)}</option>`;
        }).join('');
    }

    function getSpeakerNames(selectedName = '') {
        const names = new Set();

        rawLogData.forEach(item => {
            if (!item || item.type === 'image') return;
            if (item.name && item.name !== 'system') names.add(item.name);
        });

        Object.keys(charColorMap).forEach(name => {
            if (name && name !== 'KP（空白）') names.add(name);
        });

        const currentName = selectedName || '';
        if (currentName) names.add(currentName);

        return [...names].sort((a, b) => a.localeCompare(b, 'zh-Hant'));
    }

    function getSpeakerOptionsHTML(index, selectedName = '', query = '') {
        const normalizedQuery = query.trim().toLowerCase();
        const names = getSpeakerNames(selectedName)
            .filter(name => !normalizedQuery || name.toLowerCase().includes(normalizedQuery));

        if (!names.length) {
            const customLabel = query.trim();
            if (customLabel) {
                return `<button type="button" class="speaker-option" onmousedown="event.preventDefault(); chooseSpeaker(${index}, '${escapeAttr(customLabel)}')">使用「${escapeAttr(customLabel)}」</button>`;
            }
            return `<div class="speaker-option-empty">沒有符合的角色</div>`;
        }

        return names.map(name => {
            const active = name === selectedName ? ' active' : '';
            return `<button type="button" class="speaker-option${active}" onmousedown="event.preventDefault(); chooseSpeaker(${index}, '${escapeAttr(name)}')">${escapeAttr(name)}</button>`;
        }).join('');
    }

    function isChannelVisible(ch) {
        if (ch === '[main]') return true;
        const conf = channelConfigs[ch];
        return conf ? conf.checked : true;
    }

    function isDiscordChannel(ch) {
        return rawLogData.some(item => item && item.source === 'discord' && item.ch === ch);
    }

    function hasDiscordLogData() {
        return rawLogData.some(item => item && item.source === 'discord');
    }

    function getDiscordChannelSummaries() {
        const map = new Map();

        rawLogData.forEach(item => {
            if (!item || item.source !== 'discord' || !item.ch) return;

            if (!map.has(item.ch)) {
                map.set(item.ch, {
                    ch: item.ch,
                    label: getChannelLabel(item.ch),
                    count: 0
                });
            }

            map.get(item.ch).count++;
        });

        const orderedKeys = sortChannelsByUserOrder([...map.keys()]);
        return orderedKeys.map(ch => map.get(ch)).filter(Boolean);
    }

    function normalizeDiscordOtherChannels() {
        const discordKeys = new Set(getDiscordChannelSummaries().map(channel => channel.ch));
        discordOtherChannels = discordOtherChannels.filter(ch => discordKeys.has(ch));
        return discordOtherChannels;
    }

    function isOtherChannel(ch) {
        return ch === '[other]' || discordOtherChannels.includes(ch);
    }

    function shouldDisplayItemTime(item) {
        if (!item || !item.displayTime) return false;
        if (globalTimeDisplayMode === 'all') return true;
        if (globalTimeDisplayMode === 'other') return isOtherChannel(item.ch);
        return false;
    }

    function getTimeDisplayModeLabel() {
        if (globalTimeDisplayMode === 'all') return '時間：全部顯示';
        if (globalTimeDisplayMode === 'other') return '時間：只顯示場外';
        return '時間：不顯示';
    }

    function syncTimeDisplayControls() {
        globalShowTime = globalTimeDisplayMode !== 'none';
        const globalShowTimeEl = document.getElementById('global-show-time');
        if (globalShowTimeEl) globalShowTimeEl.checked = globalShowTime;

        const button = document.getElementById('discord-time-mode-btn');
        if (button) button.textContent = getTimeDisplayModeLabel();
    }

    function setTimeDisplayMode(mode) {
        globalTimeDisplayMode = ['none', 'all', 'other'].includes(mode) ? mode : 'none';
        syncTimeDisplayControls();
        liveRenderLog();
        saveToLocal();
    }

    function cycleTimeDisplayMode() {
        const nextMode = globalTimeDisplayMode === 'none' ? 'all' : (globalTimeDisplayMode === 'all' ? 'other' : 'none');
        setTimeDisplayMode(nextMode);
    }

    function getChannelSummaries() {
        const map = new Map();

        rawLogData.forEach(item => {
            if (!item || !isChannelVisible(item.ch)) return;

            if (!map.has(item.ch)) {
                map.set(item.ch, {
                    ch: item.ch,
                    label: getChannelLabel(item.ch),
                    count: 0
                });
            }

            map.get(item.ch).count++;
        });

        const orderedKeys = sortChannelsByUserOrder([...map.keys()]);
        return orderedKeys.map(ch => map.get(ch)).filter(Boolean);
    }

    function ensureActiveChannelTab() {
        const channels = getChannelSummaries();
        if (!channels.length) {
            activeChannelTab = '[main]';
            return;
        }

        if (!channels.some(channel => channel.ch === activeChannelTab)) {
            activeChannelTab = channels[0].ch;
        }
    }

    function reorderChannelTab(sourceCh, targetCh) {
        if (!sourceCh || !targetCh || sourceCh === targetCh) return;

        normalizeChannelOrder();
        const sourceIndex = channelOrder.indexOf(sourceCh);
        const targetIndex = channelOrder.indexOf(targetCh);
        if (sourceIndex < 0 || targetIndex < 0) return;

        const [moved] = channelOrder.splice(sourceIndex, 1);
        channelOrder.splice(targetIndex, 0, moved);
        renderChannelTabs();
        renderConfigPanel();
        liveRenderTOC();
        saveToLocal();
    }

    function renderChannelTabs() {
        const tabs = document.getElementById('channel-tabs');
        if (!tabs) return;

        if (logViewMode !== 'channel') {
            tabs.style.display = 'none';
            tabs.innerHTML = '';
            return;
        }

        const channels = getChannelSummaries();
        ensureActiveChannelTab();
        tabs.style.display = channels.length ? 'flex' : 'none';
        tabs.innerHTML = '';

        channels.forEach(channel => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = `channel-tab-btn${channel.ch === activeChannelTab ? ' active' : ''}`;
            btn.title = channel.label;
            btn.draggable = true;
            btn.dataset.channel = channel.ch;

            const label = document.createElement('span');
            label.className = 'channel-tab-label';
            label.textContent = channel.label;
            btn.appendChild(label);

            const count = document.createElement('span');
            count.className = 'channel-tab-count';
            count.textContent = channel.count;
            btn.appendChild(count);

            btn.addEventListener('dragstart', event => {
                draggedChannelTab = channel.ch;
                suppressChannelTabClick = false;
                btn.classList.add('dragging');
                event.dataTransfer.effectAllowed = 'move';
                event.dataTransfer.setData('text/plain', channel.ch);
            });

            btn.addEventListener('dragover', event => {
                if (!draggedChannelTab || draggedChannelTab === channel.ch) return;
                event.preventDefault();
                event.dataTransfer.dropEffect = 'move';
                btn.classList.add('drag-over');
            });

            btn.addEventListener('dragleave', () => {
                btn.classList.remove('drag-over');
            });

            btn.addEventListener('drop', event => {
                event.preventDefault();
                btn.classList.remove('drag-over');
                const sourceCh = event.dataTransfer.getData('text/plain') || draggedChannelTab;
                if (sourceCh && sourceCh !== channel.ch) {
                    suppressChannelTabClick = true;
                    reorderChannelTab(sourceCh, channel.ch);
                    setTimeout(() => { suppressChannelTabClick = false; }, 0);
                }
            });

            btn.addEventListener('dragend', () => {
                btn.classList.remove('dragging', 'drag-over');
                draggedChannelTab = null;
                setTimeout(() => { suppressChannelTabClick = false; }, 0);
            });

            btn.addEventListener('click', () => {
                if (suppressChannelTabClick) return;
                setActiveChannelTab(channel.ch);
            });
            tabs.appendChild(btn);
        });
    }

    function getRenderableLogEntries() {
        ensureActiveChannelTab();

        return rawLogData
            .map((item, index) => ({ item, index }))
            .filter(({ item }) => {
                if (!item || !isChannelVisible(item.ch)) return false;
                return logViewMode !== 'channel' || item.ch === activeChannelTab;
            });
    }

    function startMoveItem(index) {
        if (document.body.getAttribute('data-mode') !== 'edit') return;

        const range = getMergedRange(index);

        moveSourceIndex = index;
        moveRangeStart = range.start;
        moveRangeEnd = range.end;
        moveMode = true;
        activeIndex = index;

        liveRenderLog();
    }

    function cancelMoveMode() {
        moveSourceIndex = null;
        moveRangeStart = null;
        moveRangeEnd = null;
        moveMode = false;
        clearFloatingInsertLine();
        clearFloatingBoundaryHint();
        rerenderKeepViewport();
    }

    function moveLogItem(targetIndex) {
        if (moveRangeStart === null || moveRangeEnd === null) return;
        if (targetIndex === null || targetIndex === undefined) return;

        const movingItems = rawLogData.slice(moveRangeStart, moveRangeEnd + 1);
        if (!movingItems.length) return;

        rawLogData.splice(moveRangeStart, movingItems.length);

        let adjustedTargetIndex = targetIndex;
        if (moveRangeStart < targetIndex) {
            adjustedTargetIndex -= movingItems.length;
        }

        rawLogData.splice(adjustedTargetIndex, 0, ...movingItems);
        const firstMovedIndex = adjustedTargetIndex;
        const lastMovedIndex = adjustedTargetIndex + movingItems.length - 1;

        // 這組搬過去後，第一塊跟上方是否要融合
        if (firstMovedIndex > 0) {
            rawLogData[firstMovedIndex].splitBefore =
                !canAutoJoin(rawLogData[firstMovedIndex - 1], rawLogData[firstMovedIndex]);
        } else {
            rawLogData[firstMovedIndex].splitBefore = false;
        }

        // 這組搬過去後，下一塊跟這組最後一塊是否要融合
        if (lastMovedIndex < rawLogData.length - 1) {
            rawLogData[lastMovedIndex + 1].splitBefore =
                !canAutoJoin(rawLogData[lastMovedIndex], rawLogData[lastMovedIndex + 1]);
        }

        activeIndex = adjustedTargetIndex;
        moveSourceIndex = null;
        moveRangeStart = null;
        moveRangeEnd = null;
        moveMode = false;
        clearFloatingInsertLine();
        clearFloatingBoundaryHint();

        rerenderKeepViewport();
        saveToLocal({ rawLogChanged: true });
    }
    function clearFloatingInsertLine() {
        hoverInsertIndex = null;
        hoverInsertTop = null;

        const oldLine = document.querySelector('.floating-insert-line');
        if (oldLine) oldLine.remove();
    }

    function renderFloatingInsertLine() {
        const out = document.getElementById('out-content');
        const oldLine = out.querySelector('.floating-insert-line');
        if (oldLine) oldLine.remove();

        if (!moveMode || hoverInsertIndex === null || hoverInsertTop === null) return;

        const line = document.createElement('div');
        line.className = 'floating-insert-line';
        line.style.top = `${hoverInsertTop}px`;
        line.innerHTML = `<span>插入到此處</span>`;
        out.appendChild(line);
    }

    function updateFloatingInsertFromPointer(e) {
        if (!moveMode) return;

        const out = document.getElementById('out-content');
        const logItem = e.target.closest('.log-item');

        if (!logItem || !out.contains(logItem)) {
            clearFloatingInsertLine();
            return;
        }

        const index = Number(logItem.dataset.index);
        if (Number.isNaN(index)) {
            clearFloatingInsertLine();
            return;
        }

        const rect = logItem.getBoundingClientRect();
        const outRect = out.getBoundingClientRect();
        const midY = rect.top + rect.height / 2;

        let targetIndex;
        let top;

        if (e.clientY < midY) {
            targetIndex = index;
            top = rect.top - outRect.top;
        } else {
            targetIndex = index + 1;
            top = rect.bottom - outRect.top;
        }

        const isInsideMovingGroup =
            moveRangeStart !== null &&
            targetIndex >= moveRangeStart &&
            targetIndex <= moveRangeEnd;

        const isRightAfterMovingGroup =
            moveRangeEnd !== null &&
            targetIndex === moveRangeEnd + 1;

        if (isInsideMovingGroup || isRightAfterMovingGroup) {
            clearFloatingInsertLine();
            return;
        }

        hoverInsertIndex = targetIndex;
        hoverInsertTop = top;
        renderFloatingInsertLine();
    }

    function getValidTheme(theme) {
        return THEME_PRESETS[theme] ? theme : 'light';
    }

    function updateThemeSelect() {
        const select = document.getElementById('theme-select');
        if (select) select.value = getValidTheme(document.body.getAttribute('data-theme'));
    }

    function setTheme(theme) {
        const newTheme = getValidTheme(theme);
        document.body.setAttribute('data-theme', newTheme);
        updateThemeSelect();
        updateColorsToTheme(newTheme);
        saveToLocal();
    }

    function toggleTheme() {
        const currentTheme = getValidTheme(document.body.getAttribute('data-theme'));
        setTheme(currentTheme === 'dark' ? 'light' : 'dark');
    }

    function updateColorsToTheme(theme) {
        const preset = THEME_PRESETS[getValidTheme(theme)];
        const defaultTextColor = getDefaultLogTextColor(theme);
        charColorMap["KP（空白）"] = preset.kpText;
        charColorMap["KP嚗征?踝?"] = preset.kpText;
        Object.keys(charColorMap).forEach(name => {
            if (name === "KP（空白）" || name === "KP嚗征?踝?") return;
            if (manualCharColorMap[name]) return;
            if (detectedCharColorMap[name]) return;
            charColorMap[name] = defaultTextColor;
        });
        Object.keys(channelConfigs).forEach(ch => {
            const conf = channelConfigs[ch];
            conf.bgColor = (ch === '[info]') ? preset.infoBg : isOtherChannel(ch) ? preset.otherBg : preset.customBg;
        });
        renderConfigPanel(); liveRenderLog();
    }

    function getDefaultLogTextColor(theme = document.body.getAttribute('data-theme')) {
        return THEME_PRESETS[getValidTheme(theme)]?.kpText || '#4a4a4a';
    }

    function makeEditable(index) {
        if (document.body.getAttribute('data-mode') !== 'edit') return;
        if (moveMode) return;
        if (editingIndex === index) return;

        activeIndex = index;
        editingIndex = index;

        const textNode = document.querySelector(`[data-index="${index}"] .text-content`);
        if (!textNode) {
            editingIndex = null;
            return;
        }

        const cleanContent = rawLogData[index].html || '';

        textNode.innerText = cleanContent;
        textNode.contentEditable = "true";
        textNode.focus();

        textNode.onkeydown = function(e) {
            const key = e.key.toLowerCase();

            if (e.ctrlKey) {
                if (key === 'b') {
                    e.preventDefault();
                    wrapSelection(textNode, '**');
                    return;
                } else if (key === 'i') {
                    e.preventDefault();
                    wrapSelection(textNode, '//');
                    return;
                } else if (key === 'u') {
                    e.preventDefault();
                    wrapSelection(textNode, '__');
                    return;
                } else if (e.shiftKey && key === 'x') {
                    e.preventDefault();
                    wrapSelection(textNode, '~~');
                    return;
                }
            }

            // 可選：Ctrl+Enter 提交
            if (e.ctrlKey && key === 'enter') {
                e.preventDefault();
                commitEditing({ rerender: true, keepViewport: true });
            }
        };
    }

    function focusEditableAfterRender(index) {
        requestAnimationFrame(() => {
            requestAnimationFrame(() => {
                makeEditable(index);
            });
        });
    }

    function wrapSelection(el, wrapper) {
        const selection = window.getSelection();
        if (!selection.rangeCount) return;

        const range = selection.getRangeAt(0);

        // 確保選取範圍在這個編輯區內
        if (!el.contains(range.commonAncestorContainer)) return;

        const selectedText = selection.toString();

        if (selectedText.length > 0) {
            // 有選取文字 → 包起來
            const newText = wrapper + selectedText + wrapper;
            document.execCommand('insertText', false, newText);
        } else {
            // 沒選取 → 插入成對符號
            const newText = wrapper + wrapper;
            document.execCommand('insertText', false, newText);

            // 把游標往中間移
            moveCursorBackward(wrapper.length);
        }
    }

    function moveCursorBackward(count) {
        const selection = window.getSelection();
        if (!selection.rangeCount) return;

        const range = selection.getRangeAt(0);
        range.setStart(range.startContainer, range.startOffset - count);
        range.collapse(true);

        selection.removeAllRanges();
        selection.addRange(range);
    }

    function liveRenderLog() {
        const out = document.getElementById('out-content'); 
        out.innerHTML = '';
        renderChannelTabs();
        const globalShowName = document.getElementById('global-show-name')?.checked;
        syncTimeDisplayControls();
        const currentMode = document.body.getAttribute('data-mode');
        let lastRenderedType = null;
              
        
        getRenderableLogEntries().forEach(({ item, index }) => {
            if (item?.type === 'image' && (!item.src || item.missingLocalAsset || !isRenderableImageSrc(item.src))) return;

            const conf = channelConfigs[item.ch]; 
            
            const wrap = document.createElement('div'); 
            wrap.className = 'log-item';
            wrap.dataset.index = index;
            wrap.dataset.channel = item.ch || '';

            if (currentMode === 'edit' && index === activeIndex) {
                wrap.classList.add('active-item');
            }

            if (
                currentMode === 'edit' &&
                moveMode &&
                moveRangeStart !== null &&
                moveRangeEnd !== null &&
                index >= moveRangeStart &&
                index <= moveRangeEnd
            ) {
                wrap.classList.add('move-group');
            }

            if (currentMode === 'edit' && moveMode && index === moveSourceIndex) {
                wrap.classList.add('move-source');
            }

            const displayColor = (item.name === "" || item.name === "system") ? (charColorMap["KP（空白）"] || charColorMap["KP嚗征?踝?"] || getDefaultLogTextColor()) : (charColorMap[item.name] || getDefaultLogTextColor());
            const isNameVisibleForChar = item.name && charNameVisibilityMap[item.name] !== false;
            const shouldShowName = !!(globalShowName && item.name && item.name !== "system" && isNameVisibleForChar);
            const shouldShowTime = shouldDisplayItemTime(item);
            const timeLabel = shouldShowTime ? `<span class="log-time-label${shouldShowName ? '' : ' no-name-time'}">${escapeAttr(item.displayTime)}</span>` : '';
            const nameLabel = (shouldShowName || shouldShowTime) ? `<span class="char-name-label" style="color:${displayColor}">${shouldShowName ? escapeAttr(item.name) : ''}${timeLabel}</span>` : '';
            const parsedContent = parseCustomMarkdown(item.html);
            const alignStyle = item.align === "center" ? "text-align:center;" : "";
            const textHTML = `<div class="text-content" >${parsedContent}</div>`;

            let contentHTML = '';
            let renderType = 'main';

          
            if (item.type === 'image') {
                renderType = 'main';
                const imageAlign = item.align === 'center' ? 'center' : 'left';
                contentHTML = `
                    <div class="log-image-wrap" style="text-align:${imageAlign};">
                        <img class="log-image" src="${escapeAttr(item.src)}" alt="${escapeAttr(item.alt || '插入圖片')}">
                    </div>`;
            }
            else if (logViewMode === 'channel') {
                renderType = 'main';
                contentHTML = `<div class="log-line" style="${alignStyle} color:${displayColor};">${nameLabel}${textHTML}</div>`;
            }
            // 處理 [main] 頻道與結局偵測
            else if (item.ch === '[main]') {
                const rawMainText = item.html || '';

                const isKPOrSystem = item.name.includes("KP") || item.name === "" || item.name === "system";
                const hasKeyWord = /結局|ENDING|END|FIN|通關/i.test(rawMainText);
                const noMarkers = !/[「」""。]/.test(rawMainText);

                if (isKPOrSystem && hasKeyWord && noMarkers && rawMainText.trim() !== "") {
                    renderType = 'ending';
                    const endingHTML = `<span class="text-content">${parseCustomMarkdown(rawMainText)}</span>`;
                    contentHTML = `<div class="log-line ending-text" style="color:${displayColor}; text-align:center; font-weight:900; font-size:1.3em; background:rgba(128,128,128,0.08); border-radius:10px; border-top:2px solid ${displayColor}; border-bottom:2px solid ${displayColor}; letter-spacing:3px;">${endingHTML}</div>`;
                } else {
                    renderType = 'main';
                    contentHTML = `<div class="log-line" style="${alignStyle} color:${displayColor};">${nameLabel}${textHTML}</div>`;
                }
            }
