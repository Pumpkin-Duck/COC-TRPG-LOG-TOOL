    function checkMerging() {
        const items = document.querySelectorAll('.log-item');
        let i = 0;

        while (i < items.length) {
            const item = items[i];
            const block = item.querySelector('.block-styled');

            if (!block) {
                i++;
                continue;
            }

            // --- 1. 找出這一組「合併塊」的範圍 ---
            let group = [item];
            let j = i + 1;
            const currentChannel = block.getAttribute('data-channel');
            const currentBg = block.style.backgroundColor;
            if (currentChannel === '[main]' || isOtherChannel(currentChannel)) {
                i++;
                continue;
            }
            

            while (j < items.length) {
                const nextBlock = items[j].querySelector('.block-styled');
                if (nextBlock && 
                    nextBlock.getAttribute('data-channel') === currentChannel && 
                    nextBlock.style.backgroundColor === currentBg &&
                    nextBlock.getAttribute('data-split') !== 'true') {
                    group.push(items[j]);
                    j++;
                } else {
                    break;
                }
            }

            // --- 2. 在這一組中「搜尋」第一個符合條件的角色顏色 ---
            let groupColor = null;
            for (let member of group) {
                const dataIndex = member.dataset.index;
                const logEntry = rawLogData[dataIndex];
                
                // 排除條件：包含 KP (不分大小寫)、system、或是空名字
                const isNotKP = !logEntry.name.toUpperCase().includes("KP");
                const isNotEmpty = logEntry.name.trim() !== "" && logEntry.name !== "system";

                if (isNotKP && isNotEmpty) {
                    groupColor = charColorMap[logEntry.name];
                    break; // 找到第一個角色了，跳出循環
                }
            }

            // --- 3. 決定最終邊框顏色 ---
            // 優先序：頻道自訂邊色 > 剛才搜到的角色色 > 預設咖啡色
            const conf = channelConfigs[rawLogData[item.dataset.index].ch];
            const finalColor = (conf.borderColor && conf.borderColor !== "var(--primary-color)") 
                            ? conf.borderColor 
                            : (groupColor || "var(--primary-color)");

            // --- 4. 統一套用顏色與合併狀態 ---
            group.forEach((member, idx) => {
                const memberBlock = member.querySelector('.block-styled');

                if (idx > 0) {
                    memberBlock.setAttribute('data-merged', 'true');
                    member.classList.add('merged-follow');
                } else {
                    memberBlock.removeAttribute('data-merged');
                    member.classList.remove('merged-follow');
                }

                memberBlock.style.setProperty('border-left-color', finalColor, 'important');
                const infoTag = memberBlock.querySelector('.info-tag');
                if (infoTag) infoTag.style.color = finalColor;
            });

            i = j; // 跳到下一組
        }
    }

    function isBlobUrl(src) {
        return typeof src === 'string' && src.startsWith('blob:');
    }

    async function blobUrlToDataUrl(blobUrl) {
        const response = await fetch(blobUrl);
        const blob = await response.blob();

        return await new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = reject;
            reader.readAsDataURL(blob);
        });
    }

    async function prepareLogDataForHtmlExport(items) {
        const exportItems = JSON.parse(JSON.stringify(items || []));
        let failedCount = 0;

        for (const item of exportItems) {
            if (item?.type !== 'image' || !isBlobUrl(item.src)) continue;

            try {
                item.src = await blobUrlToDataUrl(item.src);
                item.isBlobUrl = false;
                item.isDataUrl = true;
                item.missingLocalAsset = false;
            } catch (error) {
                failedCount++;
                console.warn('Failed to convert blob image for export:', item, error);
                item.originalBlobSrc = item.src;
                item.src = '';
                item.isBlobUrl = false;
                item.missingLocalAsset = true;
            }
        }

        if (failedCount > 0) {
            console.warn(`${failedCount} image(s) failed to convert for export.`);
        }

        return { items: exportItems, failedCount };
    }

        activeIndex = prevActiveIndex;
        tocEditIndex = prevTocEditIndex;
        document.getElementById('output').style.display = prevOutputDisplay;
        liveRenderLog();
        return html;
    }

    async function downloadHTML() {
        // TODO: 下載 HTML 前需將 blob URL 圖片轉成 base64，否則離開本頁後圖片會失效。
        const blobImageCount = rawLogData.filter(item =>
            item &&
            item.type === 'image' &&
            isBlobUrl(item.src)
        ).length;

        if (blobImageCount > 0 && !confirm(`此團錄包含 ${blobImageCount} 張本地匯入圖片，下載 HTML 時會將圖片內嵌到檔案中，檔案可能較大。是否繼續？`)) {
            return;
        }

        const button = document.querySelector('button[onclick="downloadHTML()"]');
        const oldButtonText = button?.innerText;
        if (button) {
            button.innerText = '正在準備圖片...';
            button.disabled = true;
        } else {
            console.log('Preparing images for export...');
        }

        try {
        const exportTitle = document.getElementById('scenario-name').value || 'Log';
        const shouldExportChannelTabs = logViewMode === 'channel';
        const { items: exportLogData, failedCount } = await prepareLogDataForHtmlExport(rawLogData);
        if (failedCount > 0) {
            alert(`有 ${failedCount} 張本機圖片無法轉存到下載 HTML，已略過這些圖片以避免產生失效的 blob 連結。`);

        const content = captureExportOutputHTML(exportLogData);
        const style = document.querySelector('style').innerHTML;

        const tocHTML = buildExportTOCHTML();
        const channelTabsHTML = shouldExportChannelTabs ? buildExportChannelTabsHTML(getChannelSummaries()) : '';

        const fullHTML = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${escapeHtml(exportTitle)}</title><style>${style}${exportStyle}</style></head><body data-theme="${currentTheme}">${tocHTML}<div class="container"><div id="output">${content}</div></div>${channelTabsHTML}${buildToolExportDataScript(exportLogData)}${buildExportInteractiveScript()}</body></html>`;
        const blob = new Blob([fullHTML], { type: 'text/html' });
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `${exportTitle}.html`; a.click();
        } finally {
            if (button) {
                button.innerText = oldButtonText;
                button.disabled = false;
            }
        }
    }

    function detectLogSource(htmlText) {
        const text = String(htmlText || '');
        if (text.includes(`id="${EXPORT_DATA_SCRIPT_ID}"`) || text.includes(`id='${EXPORT_DATA_SCRIPT_ID}'`)) {
            return 'tool';
        }
        const discordMarkers = [
            'chatlog__message-container',
            'chatlog__author',
            'chatlog__timestamp',
            'chatlog__content',
            'preamble__entry'
        ];
        const hasMessageContainer = text.includes('chatlog__message-container');
        const hitCount = discordMarkers.filter(marker => text.includes(marker)).length;

        return hasMessageContainer && hitCount >= 3 ? 'discord' : 'ccfolia';
    }

        switchMode(settings.mode || 'view');
        liveUpdateHeader();
        liveRenderLog();
        saveToLocal({ rawLogChanged: true, introImageChanged: !!settings.imgSrc });
    }

    function getDiscordMeta(doc) {
        const entries = Array.from(doc.querySelectorAll('.preamble__entry'))
            .map(el => (el.textContent || '').trim())
            .filter(Boolean);

        const guildName = entries[0] || '';
        const channelPath = entries[1] || '';
        const pathParts = channelPath.split('/').map(part => part.trim()).filter(Boolean);
        const channelName = pathParts[pathParts.length - 1] || channelPath.trim() || 'Discord';

        return {
            guildName,
            channelPath,
            channelName
        };
    }

    function stripDiscordEditedMarker(text) {
        return String(text || '')
            .replace(/\s*\(edited\)\s*/gi, ' ')
            .replace(/\s*（edited）\s*/gi, ' ');
    }

    function normalizeDiscordDisplayTime(text) {
        return stripDiscordEditedMarker(text)
            .replace(/\s*星期[一二三四五六日]\s*/g, ' ')
            .replace(/\s+/g, ' ')
            .trim();
    }

    function makeUniqueChannelKey(baseCh, usedKeys) {
        if (!usedKeys.has(baseCh)) {
            usedKeys.add(baseCh);
            return baseCh;
        }

        const closeIndex = baseCh.lastIndexOf(']');
        const prefix = closeIndex >= 0 ? baseCh.slice(0, closeIndex) : baseCh;
        const suffix = closeIndex >= 0 ? baseCh.slice(closeIndex) : '';
        let counter = 2;
        let nextCh = `${prefix}-${counter}${suffix}`;

        while (usedKeys.has(nextCh)) {
            counter++;
            nextCh = `${prefix}-${counter}${suffix}`;
        }

        usedKeys.add(nextCh);
        return nextCh;
    }

    function parseDiscordTimestamp(text, fallbackDate) {
        text = normalizeDiscordDisplayTime(text);
        if (!text) return null;

        let normalized = text
            .replace(/\s+/g, ' ')
            .replace(/上午/g, 'AM')
            .replace(/下午/g, 'PM')
            .replace(/凌晨/g, 'AM')
            .replace(/中午/g, 'PM')
            .trim();

        let match = normalized.match(/(\d{4})[\/\-年.](\d{1,2})[\/\-月.](\d{1,2})日?\s*(AM|PM)?\s*(\d{1,2}):(\d{2})(?::(\d{2}))?/i);
        if (match) {
            let hour = Number(match[5]);
            const ampm = (match[4] || '').toUpperCase();
            if (ampm === 'PM' && hour < 12) hour += 12;
            if (ampm === 'AM' && hour === 12) hour = 0;
            return new Date(Number(match[1]), Number(match[2]) - 1, Number(match[3]), hour, Number(match[6]), Number(match[7] || 0)).getTime();
        }

        match = normalized.match(/(AM|PM)\s*(\d{1,2}):(\d{2})(?::(\d{2}))?/i);
        if (match && fallbackDate) {
            let hour = Number(match[2]);
            const ampm = match[1].toUpperCase();
            if (ampm === 'PM' && hour < 12) hour += 12;
            if (ampm === 'AM' && hour === 12) hour = 0;
            return new Date(fallbackDate.getFullYear(), fallbackDate.getMonth(), fallbackDate.getDate(), hour, Number(match[3]), Number(match[4] || 0)).getTime();
        }

        match = normalized.match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?$/);
        if (match && fallbackDate) {
            return new Date(fallbackDate.getFullYear(), fallbackDate.getMonth(), fallbackDate.getDate(), Number(match[1]), Number(match[2]), Number(match[3] || 0)).getTime();
        }

        const parsed = Date.parse(normalized);
        return Number.isNaN(parsed) ? null : parsed;
    }

    function getDiscordAuthorColor(authorEl) {
        if (!authorEl) return '';
        const inlineColor = authorEl.style?.color || '';
        if (inlineColor) return rgbToHex(inlineColor) || inlineColor;

        const styleText = authorEl.getAttribute('style') || '';
        const match = styleText.match(/color\s*:\s*([^;]+)/i);
        return match ? (rgbToHex(match[1].trim()) || match[1].trim()) : '';
    }

    function isDiscordAttachmentImage(img) {
        if (!img) return false;
        if (img.closest('.chatlog__avatar, .chatlog__emoji, .chatlog__reaction, .chatlog__reactions, .chatlog__sticker, .preamble__guild-icon')) return false;
        return img.matches('img.chatlog__attachment-media, .chatlog__attachment img, .chatlog__attachment-media img');
    }

    function safeDecodeURIComponent(path) {
        try {
            return decodeURIComponent(String(path || ''));
        } catch (err) {
            return String(path || '');
        }
    }

    function normalizeAssetPath(path) {
        const normalized = safeDecodeURIComponent(path)
            .replace(/\\/g, '/')
            .split(/[?#]/)[0]
            .replace(/^\.?\//, '')
            .replace(/\/+/g, '/')
            .trim();

        const parts = [];
        normalized.split('/').forEach(part => {
            if (!part || part === '.') return;
            if (part === '..') {
                if (parts.length) parts.pop();
                return;
            }
            parts.push(part);
        });
        return parts.join('/');
    }

    function stripTopFolder(path) {
        const normalized = normalizeAssetPath(path);
        const parts = normalized.split('/').filter(Boolean);
        return parts.length > 1 ? parts.slice(1).join('/') : normalized;
    }

    function addAssetMapKey(map, key, file) {
        const normalized = normalizeAssetPath(key);
        if (normalized && !map.has(normalized)) map.set(normalized, file);
    }

    function buildDiscordAssetMap(files) {
        const map = new Map();
        Array.from(files || []).forEach(file => {
            const relPath = file.webkitRelativePath || file.name || '';
            if (!relPath) return;

            addAssetMapKey(map, relPath, file);
            addAssetMapKey(map, stripTopFolder(relPath), file);
            addAssetMapKey(map, safeDecodeURIComponent(relPath), file);
        });
        return map;
    }

    function isRenderableImageSrc(src) {
        const value = String(src || '').trim();
        if (!value) return false;
        if (/^file:/i.test(value)) return false;
        return /^(https?:\/\/|data:image\/|blob:)/i.test(value);
    }

    function isDirectDiscordImageSrc(src) {
        return /^(https?:\/\/|data:image\/|blob:)/i.test(String(src || '').trim());
    }

    function getFileDirectory(file) {
        const relPath = normalizeAssetPath(file?.webkitRelativePath || file?.name || '');
        const index = relPath.lastIndexOf('/');
        return index >= 0 ? relPath.slice(0, index) : '';
    }

    function resolveDiscordAssetFile(src, htmlFile, assetMap) {
        if (!src || !assetMap || isDirectDiscordImageSrc(src)) return null;

        const htmlDir = getFileDirectory(htmlFile);
        const normalizedSrc = normalizeAssetPath(src);
        const htmlRelativeSrc = normalizeAssetPath(htmlDir ? `${htmlDir}/${src}` : src);
        const candidates = [...new Set([
            htmlRelativeSrc,
            normalizedSrc,
            stripTopFolder(htmlRelativeSrc),
            stripTopFolder(normalizedSrc)
        ])];

        for (const candidate of candidates) {
            const key = normalizeAssetPath(candidate);
            if (key && assetMap.has(key)) return assetMap.get(key);
        }

        return null;
    }

    function revokeActiveBlobUrls() {
        activeBlobUrls.forEach(url => URL.revokeObjectURL(url));
        activeBlobUrls = [];
    }

    function parseDiscordHtmlToRawLogData(htmlText, options = {}) {
        const doc = new DOMParser().parseFromString(htmlText, 'text/html');
        const meta = getDiscordMeta(doc);
        const channelName = options.channelName || meta.channelName || 'Discord';
        const ch = options.ch || `[dc:${channelName}]`;
        parseDiscordHtmlToRawLogData.discordMeta = { ...meta, channelName, ch };

        const currentTheme = getValidTheme(document.body.getAttribute('data-theme'));
        channelConfigs[ch] = {
            checked: true,
            label: channelName,
            bgColor: THEME_PRESETS[currentTheme].customBg,
            borderColor: 'var(--primary-color)'
        };

        const items = [];
        let lastAuthor = null;
        let lastTimestamp = null;
        let lastDate = null;

        doc.querySelectorAll('.chatlog__message-container').forEach(container => {
            const messageId = container.getAttribute('data-message-id') || '';
            const authorEl = container.querySelector('.chatlog__author');
            const fullTimeEl = container.querySelector('.chatlog__timestamp');
            const shortTimeEl = container.querySelector('.chatlog__short-timestamp');

            if (authorEl) {
                const name = (authorEl.textContent || '').trim();
                const detectedColor = getDiscordAuthorColor(authorEl);
                lastAuthor = {
                    name,
                    originalAuthorName: name,
                    detectedColor
                };

                if (name) {
                    if (detectedColor && !detectedCharColorMap[name]) detectedCharColorMap[name] = detectedColor;
                    if (!charColorMap[name]) charColorMap[name] = detectedColor || charColorMap["KP（空白）"] || charColorMap["KP嚗征?踝?"] || getDefaultLogTextColor();
                    if (charNameVisibilityMap[name] === undefined) charNameVisibilityMap[name] = true;
                }
            }

            const author = lastAuthor || { name: 'Discord', originalAuthorName: 'Discord', detectedColor: '#4a4a4a' };
            const timeEl = fullTimeEl || shortTimeEl;
            const titleTime = timeEl?.getAttribute('title') || '';
            const textTime = (timeEl?.textContent || '').trim();
            const displayTime = normalizeDiscordDisplayTime(titleTime || textTime || '');
            const timestamp = parseDiscordTimestamp(titleTime || textTime, lastDate);
            if (Number.isFinite(timestamp)) {
                lastTimestamp = timestamp;
                lastDate = new Date(timestamp);
            }

            const contentEl = container.querySelector('.chatlog__content, .chatlog__markdown');
            const markdown = discordHtmlToCustomMarkdown(contentEl).trim();
            const base = {
                source: 'discord',
                ch,
                channelName,
                name: author.name,
                originalAuthorName: author.originalAuthorName,
                speakerType: 'character',
                displayTime,
                timestamp: Number.isFinite(timestamp) ? timestamp : lastTimestamp,
                messageId,
                detectedColor: author.detectedColor || '#4a4a4a',
                showInTOC: false,
                tocTitle: ''
            };

            if (markdown) {
                items.push({
                    ...base,
                    type: 'text',
                    html: markdown,
                    subOrder: 0
                });
            }

            Array.from(container.querySelectorAll('img'))
                .filter(isDiscordAttachmentImage)
                .forEach((img, index) => {
                    const src = img.getAttribute('src') || '';
                    if (!src) return;
                    const assetFile = resolveDiscordAssetFile(src, options.htmlFile, options.assetMap);
                    const isLocalAsset = !isDirectDiscordImageSrc(src);
                    let finalSrc = src;
                    let isBlobUrl = false;
                    let assetPath = '';
                    let missingLocalAsset = false;

                    if (assetFile) {
                        finalSrc = URL.createObjectURL(assetFile);
                        activeBlobUrls.push(finalSrc);
                        isBlobUrl = true;
                        assetPath = assetFile.webkitRelativePath || assetFile.name || '';
                    } else if (isLocalAsset) {
                        console.warn('Discord attachment asset not found:', src);
                        missingLocalAsset = true;
                        return;
                    }

                    if (!isRenderableImageSrc(finalSrc)) return;

                    items.push({
                        ...base,
                        type: 'image',
                        html: '',
                        src: finalSrc,
                        originalSrc: src,
                        assetPath,
                        isBlobUrl,
                        missingLocalAsset,
                        alt: img.getAttribute('alt') || 'Discord 圖片附件',
                        parentMessageId: messageId,
                        subOrder: index + 1
                    });
                });
        });

        return items;
    }

    function parseDiscordHtmlToImport(htmlText, fileName = '', usedChannelKeys = new Set(Object.keys(channelConfigs)), options = {}) {
        const doc = new DOMParser().parseFromString(htmlText, 'text/html');
        const discordMeta = getDiscordMeta(doc);
        const channelName = discordMeta.channelName || 'Discord';
        const baseCh = `[dc:${channelName}]`;
        const ch = makeUniqueChannelKey(baseCh, usedChannelKeys);
        const items = parseDiscordHtmlToRawLogData(htmlText, { ...options, ch, channelName, fileName });

        const textItems = items.filter(item => item.type !== 'image');
        const imageItems = items.filter(item => item.type === 'image');
        const resolvedLocalImageCount = imageItems.filter(item => item.isBlobUrl).length;
        const missingLocalImageCount = imageItems.filter(item => item.missingLocalAsset).length;
        const authorNames = [...new Set(items.map(item => item.name).filter(Boolean))];
        const timedItems = items
            .filter(item => item.timestamp !== null && item.timestamp !== undefined && Number.isFinite(Number(item.timestamp)))
            .sort((a, b) => Number(a.timestamp) - Number(b.timestamp));
        const firstItem = timedItems[0] || items[0] || null;
        const lastItem = timedItems[timedItems.length - 1] || items[items.length - 1] || null;

        return {
            meta: {
                source: 'discord',
                fileName: fileName || '',
                guildName: discordMeta.guildName || '',
                channelPath: discordMeta.channelPath || '',
                channelName,
                ch,
                messageCount: textItems.length,
                imageCount: imageItems.length,
                resolvedLocalImageCount,
                missingLocalImageCount,
                authorNames,
                firstTimestamp: firstItem?.timestamp ?? null,
                lastTimestamp: lastItem?.timestamp ?? null,
                firstDisplayTime: firstItem?.displayTime || '',
                lastDisplayTime: lastItem?.displayTime || ''
            },
            items
        };
    }

    function readHtmlFileAsText(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = ev => resolve(ev.target.result);
            reader.onerror = () => reject(reader.error);
            reader.readAsText(file, "UTF-8");
        });
    }

    function resetImportedLogState() {
        revokeActiveBlobUrls();
        charColorMap = {};
        detectedCharColorMap = {};
        manualCharColorMap = {};
        charNameVisibilityMap = {};
        channelConfigs = {};
        channelOrder = [];
        discordOtherChannels = [];
        rawLogData = [];
        const currentTheme = getValidTheme(document.body.getAttribute('data-theme'));
        charColorMap["KP（空白）"] = THEME_PRESETS[currentTheme].kpText;
    }

    function showImportedOutput() {
        document.getElementById('output').style.display = 'block';
        document.getElementById('action-area').style.display = 'flex';
        document.getElementById('view-mode-btn').style.display = 'block';
    }

    function confirmBeforeReplacingImport() {
        if (!Array.isArray(rawLogData) || rawLogData.length === 0) return true;
        return confirm('目前已有團錄資料，重新匯入會覆蓋現有內容。確定要繼續嗎？');
    }

    function finishDiscordImport(imports) {
        const allItems = imports.flatMap(item => item.items);
        rawLogData = sortLogItems(allItems);
        setDiscordChannelOrderByFirstMessageTime();

        const firstGuildName = imports.map(item => item.meta.guildName).find(Boolean);
        if (!document.getElementById('scenario-name').value.trim() && firstGuildName) {
            document.getElementById('scenario-name').value = firstGuildName;
        }

        const globalShowTimeEl = document.getElementById('global-show-time');
        globalTimeDisplayMode = 'none';
        globalShowTime = false;
        if (globalShowTimeEl) globalShowTimeEl.checked = false;

        activeChannelTab = rawLogData[0]?.ch || '[main]';
        console.log('Discord imports:', imports.map(item => item.meta));
        if (console.table) console.table(imports.map(item => item.meta));
        showImportedOutput();
        liveUpdateHeader();
        renderConfigPanel();
        liveRenderLog();
        saveToLocal({ rawLogChanged: true });
    }

    async function importDiscordHtmlFiles(files) {
        resetImportedLogState();
        const usedChannelKeys = new Set(Object.keys(channelConfigs));
        const imports = [];

        for (const file of files) {
            const htmlText = await readHtmlFileAsText(file);
            imports.push(parseDiscordHtmlToImport(htmlText, file.name, usedChannelKeys, { htmlFile: file }));
        }

        finishDiscordImport(imports);
    }

    async function importDiscordFolderFiles(files) {
        const allFiles = Array.from(files || []);
        const htmlFiles = allFiles.filter(file => /\.html?$/i.test(file.name || file.webkitRelativePath || ''));
        const assetMap = buildDiscordAssetMap(allFiles);
        console.log('Discord folder import assets:', assetMap.size);

        const discordHtmlFiles = [];
        for (const file of htmlFiles) {
            const htmlText = await readHtmlFileAsText(file);
            if (detectLogSource(htmlText) === 'discord') {
                discordHtmlFiles.push({ file, htmlText });
            }
        }

        if (!discordHtmlFiles.length) {
            alert('未偵測到 DiscordChatExporter HTML。');
            return;
        }

        resetImportedLogState();
        const usedChannelKeys = new Set(Object.keys(channelConfigs));
        const imports = discordHtmlFiles.map(({ file, htmlText }) =>
            parseDiscordHtmlToImport(htmlText, file.name, usedChannelKeys, {
                htmlFile: file,
                assetMap
            })
        );

        finishDiscordImport(imports);
    }

    function importCcfOliaHtmlText(htmlText) {
        resetImportedLogState();
        const currentTheme = getValidTheme(document.body.getAttribute('data-theme'));
        const doc = new DOMParser().parseFromString(htmlText, 'text/html');

        doc.querySelectorAll('p').forEach(p => {
            const spans = p.querySelectorAll('span');
            if (spans.length >= 3) {
                const ch = spans[0].innerText.trim();
                let name = spans[1].innerText.trim();
                if (ch && !channelConfigs[ch]) {
                    let finalLabel = ch.replace(/[\[\]]/g, '');
                    if (finalLabel.toLowerCase() === 'info') finalLabel = '?';
                    else if (finalLabel.toLowerCase() === 'other') finalLabel = '??';
                    channelConfigs[ch] = { label: finalLabel, bgColor: (ch === '[info]') ? THEME_PRESETS[currentTheme].infoBg : (ch === '[other]') ? THEME_PRESETS[currentTheme].otherBg : THEME_PRESETS[currentTheme].customBg, checked: (ch !== '[other]') };
                }
                const rawHtml = spans[2].innerHTML || '';
                let normalizedText = normalizeImportedText(rawHtml);

                if (name === "system") {
                    const systemSpeaker = extractSystemSpeaker(normalizedText);
                    if (systemSpeaker) {
                        name = systemSpeaker.name;
                        normalizedText = systemSpeaker.text;
                    }
                }

                const detectedColor = rgbToHex(p.style.color) || "#4a4a4a";
                if (name && name !== "system") {
                    if (!detectedCharColorMap[name]) detectedCharColorMap[name] = detectedColor;
                    if (!charColorMap[name]) charColorMap[name] = detectedColor;
                    if (charNameVisibilityMap[name] === undefined) charNameVisibilityMap[name] = true;
                }

                rawLogData.push({
                    ch,
                    name,
                    html: normalizedText,
                    detectedColor,
                    showInTOC: false,
                    tocTitle: ''
                });
            }
        });

        renderConfigPanel();
        saveToLocal({ rawLogChanged: true });
    }

                    source: detectLogSource(htmlText)

            const currentTheme = getValidTheme(document.body.getAttribute('data-theme'));
            charColorMap["KP（空白）"] = THEME_PRESETS[currentTheme].kpText;

                renderConfigPanel();
                document.getElementById('output').style.display = 'block';
                document.getElementById('action-area').style.display = 'flex';
                document.getElementById('view-mode-btn').style.display = 'block';
                liveUpdateHeader();
                liveRenderLog();
                saveToLocal({ rawLogChanged: true });

            const doc = new DOMParser().parseFromString(htmlText, 'text/html');
            doc.querySelectorAll('p').forEach(p => {

                    let name = spans[1].innerText.trim();
                    if (ch && !channelConfigs[ch]) {

                        if (finalLabel.toLowerCase() === 'info') finalLabel = '情報';
                        else if (finalLabel.toLowerCase() === 'other') finalLabel = '雜談';
                        channelConfigs[ch] = { label: finalLabel, bgColor: (ch === '[info]') ? THEME_PRESETS[currentTheme].infoBg : (ch === '[other]') ? THEME_PRESETS[currentTheme].otherBg : THEME_PRESETS[currentTheme].customBg, checked: (ch !== '[other]') };
                    }
                    const rawHtml = spans[2].innerHTML || '';
                    let normalizedText = normalizeImportedText(rawHtml);

                    if (name === "system") {
                        const systemSpeaker = extractSystemSpeaker(normalizedText);
                        if (systemSpeaker) {
                            name = systemSpeaker.name;
                            normalizedText = systemSpeaker.text;
                        }
                    }

                    const detectedColor = rgbToHex(p.style.color) || "#4a4a4a";
                    if (name && name !== "system") {

    function setDiscordOtherChannel(ch, checked) {
        if (!ch || !isDiscordChannel(ch)) return;

        if (checked) {
            if (!discordOtherChannels.includes(ch)) discordOtherChannels.push(ch);
            const conf = channelConfigs[ch];
            const preset = THEME_PRESETS[getValidTheme(document.body.getAttribute('data-theme'))];
            if (conf && (!conf.bgColor || conf.bgColor === preset.customBg)) {
                conf.bgColor = preset.otherBg;
            }
        } else {
            discordOtherChannels = discordOtherChannels.filter(item => item !== ch);
            const conf = channelConfigs[ch];
            const preset = THEME_PRESETS[getValidTheme(document.body.getAttribute('data-theme'))];
            if (conf && conf.bgColor === preset.otherBg) {
                conf.bgColor = preset.customBg;
            }
        }

        normalizeDiscordOtherChannels();
        renderConfigPanel();
        liveRenderLog();
        saveToLocal();
    }

    function toggleDiscordOtherDropdown() {
        const dropdown = document.getElementById('discord-other-dropdown');
        if (!dropdown) return;
        dropdown.classList.toggle('open');
    }

    function renderDiscordOtherSelector() {
        const container = document.getElementById('discord-other-options');
        if (!container) return;

        if (!hasDiscordLogData()) {
            container.innerHTML = '';
            return;
        }

        normalizeDiscordOtherChannels();
        const channels = getDiscordChannelSummaries();
        if (!channels.length) {
            container.innerHTML = '';
            return;
        }

        const selectedCount = discordOtherChannels.length;
        const summaryText = selectedCount ? `已選 ${selectedCount} 個頻道` : '選擇 Discord 場外頻道';
        container.innerHTML = `
            <div class="discord-other-setting">
                <div class="discord-other-title">設定為場外訊息</div>
                <button type="button" class="mini-action-btn" id="discord-time-mode-btn" onclick="cycleTimeDisplayMode()" style="margin-bottom:10px;">
                    ${getTimeDisplayModeLabel()}
                </button>
                <div class="discord-other-dropdown" id="discord-other-dropdown">
                    <button type="button" class="discord-other-toggle" onclick="toggleDiscordOtherDropdown()">
                        <span>${summaryText}</span>
                        <span>▾</span>
                    </button>
                    <div class="discord-other-menu" id="discord-other-menu"></div>
                </div>
                <div class="discord-other-hint">選中的 Discord 頻道會用場外訊息樣式顯示，但仍保留原本分頻道標籤。</div>
            </div>
        `;

        const menu = document.getElementById('discord-other-menu');
        channels.forEach(channel => {
            const label = document.createElement('label');
            label.className = 'discord-other-option';

            const input = document.createElement('input');
            input.type = 'checkbox';
            input.checked = discordOtherChannels.includes(channel.ch);
            input.addEventListener('change', () => setDiscordOtherChannel(channel.ch, input.checked));

            const text = document.createElement('span');
            text.textContent = channel.label;

            label.appendChild(input);
            label.appendChild(text);
            menu.appendChild(label);
        });
    }

    function handleChannelLabelInput(input) {
        const ch = input?.dataset?.channel;
        if (!ch || !channelConfigs[ch]) return;

        channelConfigs[ch].label = input.value;
        clearTimeout(channelLabelUpdateTimer);
        channelLabelUpdateTimer = setTimeout(flushChannelLabelUpdate, 500);
    }

    function handleChannelLabelKeydown(event, input) {
        if (event.key !== 'Enter') return;
        event.preventDefault();
        flushChannelLabelUpdate();
        input.blur();
    }

    function flushChannelLabelUpdate() {
        clearTimeout(channelLabelUpdateTimer);
        channelLabelUpdateTimer = null;
        liveRenderLog();
        saveToLocal();
    }

    function getColorInputValue(value, fallback = '#a67c52') {
        const raw = String(value || '').trim();
        if (/^#[0-9a-f]{6}$/i.test(raw)) return raw;
        if (/^#[0-9a-f]{3}$/i.test(raw)) {
            return '#' + raw.slice(1).split('').map(ch => ch + ch).join('');
        }
        const fallbackRaw = String(fallback || '#a67c52').trim();
        return /^#[0-9a-f]{6}$/i.test(fallbackRaw) ? fallbackRaw : '#a67c52';
    }

    function renderConfigPanel() {
        document.getElementById('config-panel').style.display = 'block';
        const chContainer = document.getElementById('channel-options'); chContainer.innerHTML = '';
        sortChannelsByUserOrder(Object.keys(channelConfigs)).forEach(ch => {
            if (ch === '[main]') return;
            const conf = channelConfigs[ch];
            const bgColorInputValue = getColorInputValue(conf.bgColor, '#f9f9f9');
            const borderColorInputValue = getColorInputValue(conf.borderColor, getColorInputValue(getComputedStyle(document.body).getPropertyValue('--primary-color')));
            const div = document.createElement('div'); div.className = 'channel-item';
            // 在 renderConfigPanel 裡面修改頻道設定的 HTML
            div.innerHTML = `
                <input type="checkbox" id="chk-${ch}" ${conf.checked?'checked':''} onchange="channelConfigs['${ch}'].checked=this.checked; liveRenderLog(); saveToLocal();">
                <span class="channel-name">${ch.replace(/[\[\]]/g,'')}</span>
                <input type="text" class="channel-tag-input" id="tag-${ch}" data-channel="${escapeAttr(ch)}" value="${escapeAttr(conf.label)}" oninput="handleChannelLabelInput(this)" onblur="flushChannelLabelUpdate()" onkeydown="handleChannelLabelKeydown(event, this)">
                
                <div class="color-pill" style="margin-left:auto; gap:12px; padding: 6px 15px; height: auto;">
                    <div style="display:flex; flex-direction:column; align-items:center; gap:2px;">
                        <span style="font-size:10px; opacity:0.6;">底色</span>
                        <input type="color" value="${bgColorInputValue}" oninput="updateChannelColor('${ch}', 'bgColor', this.value, 'picker', this)">
                        <input type="text" class="hex-field" value="${conf.bgColor}" style="width:55px !important; font-size:11px !important; text-align:center;" oninput="updateChannelColor('${ch}', 'bgColor', this.value, 'text', this)">
                    </div>
                    
                    <div style="display:flex; flex-direction:column; align-items:center; gap:2px;">
                        <span style="font-size:10px; opacity:0.6;">邊色</span>
                        <input type="color" value="${borderColorInputValue}" oninput="updateChannelColor('${ch}', 'borderColor', this.value, 'picker', this)">
                        <input type="text" class="hex-field" value="${conf.borderColor || '#a67c52'}" style="width:55px !important; font-size:11px !important; text-align:center;" oninput="updateChannelColor('${ch}', 'borderColor', this.value, 'text', this)">
                    </div>
                </div>`;
            chContainer.appendChild(div);
        });
        renderDiscordOtherSelector();
        const charContainer = document.getElementById('character-colors'); charContainer.innerHTML = '';
        Object.keys(charColorMap).forEach(name => {
            const color = charColorMap[name];
            if (charNameVisibilityMap[name] === undefined) charNameVisibilityMap[name] = true;
            const div = document.createElement('div');
            div.className = 'channel-item';
            div.innerHTML = `
                <label style="display:flex; align-items:center; gap:8px; flex:1; min-width:0; margin:0; cursor:pointer;">
                    <input type="checkbox" ${charNameVisibilityMap[name] !== false ? 'checked' : ''} onchange="setCharNameVisible('${name}', this.checked)">
                    <span style="font-weight:bold; color: ${color}; overflow:hidden; text-overflow:ellipsis;">${name}</span>
                </label>
                <div class="color-pill">
                    <input type="color" id="cp-${name}" value="${color}" oninput="syncCharColor('${name}', this.value, 'picker', this);">
                    <input type="text" class="hex-field" id="ct-${name}" value="${color}" oninput="syncCharColor('${name}', this.value, 'text', this);">
                </div>`;
            charContainer.appendChild(div);
        });
    }
    function setCharNameVisible(name, checked) {
        charNameVisibilityMap[name] = checked;
        liveRenderLog();
        saveToLocal();
    }
    function updateChannelColor(ch, key, val, source, el) { 
        channelConfigs[ch][key] = val; 
        
        // 同步 UI：如果是點圓圈，就更新文字框；如果是打字，就更新圓圈
        const parent = el.parentNode;
        if (source === 'picker') {
            parent.querySelector('input[type="text"]').value = val;
        } else if (val.startsWith('#') && val.length === 7) {
            parent.querySelector('input[type="color"]').value = val;
        }
        
        queueColorUpdate();
    }
    function syncCharColor(name, val, source, el) { 
        charColorMap[name] = val; 
        manualCharColorMap[name] = true;
        const row = el?.closest('.channel-item');

        if (source === 'picker') {
            const textInput = row?.querySelector('input[type="text"]');
            if (textInput) textInput.value = val;
        } else if (val.startsWith('#') && val.length === 7) {
            const colorInput = row?.querySelector('input[type="color"]');
            if (colorInput) colorInput.value = val.substring(0,7);
        }

        const nameLabel = row?.querySelector('span');
        if (nameLabel) nameLabel.style.color = val;

        queueColorUpdate();
    }

    document.getElementById('out-content').addEventListener('click', function(e) {
        if (document.body.getAttribute('data-mode') !== 'edit') return;

        if (e.target.closest('.edit-tools')) return;

        if (moveMode) {
            if (hoverInsertIndex !== null) {
                moveLogItem(hoverInsertIndex);
            }
            return;
        }

        const logItem = e.target.closest('.log-item');
        if (!logItem) return;

        const index = Number(logItem.dataset.index);
        if (Number.isNaN(index)) return;

        // 已經在編輯同一塊，就不要重進
        if (editingIndex === index) {
            const clickedEditableText = e.target.closest('.text-content[contenteditable="true"]');
            const clickedEditSurface = e.target.closest('.edit-tools, .item-meta-editor, .toc-inline-editor');

            if (clickedEditableText || clickedEditSurface) {
                e.stopPropagation();
                return;
            }

            activeIndex = null;
            tocEditIndex = null;
            commitEditing({ rerender: true });
            e.stopPropagation();
            return;
        }

        e.stopPropagation();

        // 如果正在編輯別塊，先提交，再切換
        if (editingIndex !== null) {
            commitEditing({ rerender: false });
        }

        if (activeIndex !== index) {
            activeIndex = index;
            liveRenderLog();

            requestAnimationFrame(() => {
                makeEditable(index);
            });
        } else {
            makeEditable(index);
        }
    });

    document.addEventListener('click', function(e) {
        if (document.body.getAttribute('data-mode') !== 'edit') return;
        if (moveMode) return;
        if (editingIndex === null) return;

        const clickedEditableText = e.target.closest('.text-content[contenteditable="true"]');
        const clickedEditSurface = e.target.closest('.edit-tools, .item-meta-editor, .toc-inline-editor');

        if (clickedEditableText || clickedEditSurface) return;

        activeIndex = null;
        tocEditIndex = null;
        commitEditing({ rerender: true });
    });

    function applyMonochromeTextColors() {
        const monoColor = charColorMap["KP（空白）"] || getDefaultLogTextColor();

        Object.keys(charColorMap).forEach(name => {
            charColorMap[name] = monoColor;
        });

        renderConfigPanel();
        liveRenderLog();
        saveToLocal();
    }

    function redetectTextColors() {
        rawLogData.forEach(item => {
            if (!item || item.type === 'image') return;
            if (!item.name || item.name === 'system') return;

            const detectedColor = item.detectedColor || detectedCharColorMap[item.name];
            if (!detectedColor) return;

            if (!manualCharColorMap[item.name]) {
                charColorMap[item.name] = detectedColor;
            }

            if (!detectedCharColorMap[item.name]) {
                detectedCharColorMap[item.name] = detectedColor;
            }
        });

        renderConfigPanel();
        liveRenderLog();
        saveToLocal();
    }

   

    function getDefaultTOCTitle(item) {
        if (item?.type === 'image') return item.alt || '圖片';
        if (!item || !item.html) return '未命名';
        return item.html.replace(/\n+/g, ' ').trim().slice(0, 20) || '未命名';
    }

    function buildTOCItems() {
        return rawLogData
            .map((item, index) => ({ item, index }))
            .filter(({ item }) => item.showInTOC)
            .map(({ item, index }) => ({
                index,
                title: (item.tocTitle || '').trim() || getDefaultTOCTitle(item)
            }));
    }

    function renderTOC() {
        const list = document.getElementById('toc-list');
        if (!list) return;

        const items = buildTOCItems();
        list.innerHTML = '';
        const panel = document.getElementById('toc-panel');

        if (!items.length) {
            if (panel) panel.style.display = 'none';
            return;
        }

        if (panel) panel.style.display = '';

        items.forEach(({ index, title }) => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'toc-item';
            btn.dataset.index = index;
            btn.textContent = title;

            btn.addEventListener('click', () => {
                scrollToLogItem(index);
            });

            list.appendChild(btn);
        });
    }

    function scrollToLogItem(index) {
        const item = rawLogData[index];
        if (!item) return;

        if (logViewMode === 'channel' && item.ch !== activeChannelTab) {
            rememberLogScrollPosition();
            activeChannelTab = item.ch;
            tocEditIndex = null;
            ensureActiveChannelTab();
            liveRenderLog();
            saveToLocal();
        }

        activeIndex = index;
        liveRenderLog();

        requestAnimationFrame(() => {
            scrollToRenderedLogItem(index);
        });
    }

    function scrollToRenderedLogItem(index) {
        const el = document.querySelector(`#out-content .log-item[data-index="${index}"]`);
        if (!el) return;

        el.scrollIntoView({
            behavior: 'smooth',
            block: 'center'
        });
    }

    function toggleTOCEditor(index) {
        if (tocEditIndex === index) {
            tocEditIndex = null;
        } else {
            tocEditIndex = index;
        }
        liveRenderLog();
    }

    function setItemShowInTOC(index, checked) {
        if (!rawLogData[index]) return;
        rawLogData[index].showInTOC = checked;

        if (checked && !rawLogData[index].tocTitle) {
            rawLogData[index].tocTitle = getDefaultTOCTitle(rawLogData[index]);
        }

        saveToLocal({ rawLogChanged: true });
        liveRenderLog();
    }

    function setItemTOCTitle(index, value) {
        if (!rawLogData[index]) return;
        rawLogData[index].tocTitle = value;
        saveToLocal({ rawLogChanged: true });
        renderTOC();
    }

    document.getElementById('out-content').addEventListener('mousemove', function(e) {
        if (document.body.getAttribute('data-mode') !== 'edit') return;
        if (!moveMode) return;

        pendingPointerEvent = e;

        if (pointerRenderQueued) return;
        pointerRenderQueued = true;

        requestAnimationFrame(() => {
            pointerRenderQueued = false;
            if (pendingPointerEvent) {
                updateFloatingInsertFromPointer(pendingPointerEvent);
                updateFloatingBoundaryFromPointer(pendingPointerEvent);
            }
        });
    });

    document.getElementById('out-content').addEventListener('mouseleave', function() {
        if (!moveMode) return;
        clearFloatingInsertLine();
        clearFloatingBoundaryHint();
    });

  
    function addLogItemBelow(index) {
        const source = rawLogData[index];
        if (!source) return;

        const newItem = {
            isManualNew: true,
            ch: source.ch,
            name: source.name,
            html: '',
            detectedColor: source.detectedColor || detectedCharColorMap[source.name],
            align: 'left',
            splitBefore: true,
            showInTOC: false,
            tocTitle: ''
        };

        const newIndex = index + 1;
        rawLogData.splice(newIndex, 0, newItem);

        activeIndex = newIndex;
        moveMode = false;
        moveSourceIndex = null;

        rerenderKeepViewport();
        saveToLocal({ rawLogChanged: true });

        focusEditableAfterRender(newIndex);
    }

    function addImageBelow(index) {
        const source = rawLogData[index];
        if (!source) return;

        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';

        input.addEventListener('change', () => {
            const file = input.files && input.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = e => {
                const newIndex = index + 1;
                const newItem = {
                    type: 'image',
                    ch: source.ch,
                    name: source.name,
                    html: '',
                    src: e.target.result,
                    alt: file.name || '插入圖片',
                    align: 'center',
                    splitBefore: true,
                    showInTOC: false,
                    tocTitle: ''
                };

                rawLogData.splice(newIndex, 0, newItem);
                activeIndex = newIndex;
                moveMode = false;
                moveSourceIndex = null;

                rerenderKeepViewport();
                saveToLocal({ rawLogChanged: true });
            };

            reader.readAsDataURL(file);
        });

        input.click();
    }

    function canMergeItems(prev, next) {
        if (!prev || !next) return false;
        if (prev.type === 'image' || next.type === 'image') return false;
        if (prev.ch !== next.ch) return false;

        // main / other 不參與融合
        if (prev.ch === '[main]' || isOtherChannel(prev.ch)) return false;

        if (next.splitBefore) return false;

        const prevConf = channelConfigs[prev.ch];
        const nextConf = channelConfigs[next.ch];
        if (!prevConf || !nextConf) return false;

        return prevConf.bgColor === nextConf.bgColor;
    }

    function getMergedRange(index) {
        let start = index;
        let end = index;

        while (start > 0 && canMergeItems(rawLogData[start - 1], rawLogData[start])) {
            start--;
        }

        while (end < rawLogData.length - 1 && canMergeItems(rawLogData[end], rawLogData[end + 1])) {
            end++;
        }

        return { start, end };
    }

    function canAutoJoin(prev, next) {
        if (!prev || !next) return false;
        if (prev.type === 'image' || next.type === 'image') return false;
        if (prev.ch !== next.ch) return false;

        // main / other 不自動融合
        if (prev.ch === '[main]' || isOtherChannel(prev.ch)) return false;

        const prevConf = channelConfigs[prev.ch];
        const nextConf = channelConfigs[next.ch];
        if (!prevConf || !nextConf) return false;

        return prevConf.bgColor === nextConf.bgColor;
    }


    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && moveMode) {
            cancelMoveMode();
        }
    });

    function toggleGroupBoundary(nextIndex) {
        if (nextIndex <= 0 || !rawLogData[nextIndex]) return;

        rawLogData[nextIndex].splitBefore = !rawLogData[nextIndex].splitBefore;

        if (moveMode && moveSourceIndex !== null) {
            const range = getMergedRange(moveSourceIndex);
            moveRangeStart = range.start;
            moveRangeEnd = range.end;
        }

        saveToLocal({ rawLogChanged: true });
        rerenderKeepViewport();
    }

    function startMoveItemDirect(e, index) {
        if (e) {
            e.preventDefault();
            e.stopPropagation();
        }

        if (document.body.getAttribute('data-mode') !== 'edit') return;

        if (editingIndex !== null) {
            commitEditing({ rerender: false });
        }

        activeIndex = index;
        startMoveItem(index);
    }


    function captureViewportAnchor() {
        const items = [...document.querySelectorAll('#out-content .log-item')];
        if (!items.length) return null;

        let best = null;
        let minDist = Infinity;

        items.forEach(el => {
            const rect = el.getBoundingClientRect();
            const dist = Math.abs(rect.top);

            if (dist < minDist) {
                minDist = dist;
                best = {
                    index: Number(el.dataset.index),
                    topOffset: rect.top
                };
            }
        });

        return best;
    }

    function restoreViewportAnchor(anchor) {
        if (!anchor) return;

        const el = document.querySelector(`#out-content .log-item[data-index="${anchor.index}"]`);
        if (!el) return;

        const rect = el.getBoundingClientRect();
        const diff = rect.top - anchor.topOffset;

        window.scrollBy(0, diff);
    }
    function rerenderKeepViewport() {
        const anchor = captureViewportAnchor();
        liveRenderLog();
        requestAnimationFrame(() => {
            restoreViewportAnchor(anchor);
        });
    }

    function clearFloatingBoundaryHint() {
        hoverBoundaryIndex = null;
        hoverBoundaryTop = null;

        const oldHint = document.querySelector('.floating-boundary-hint');
        if (oldHint) oldHint.remove();
    }

    function renderFloatingBoundaryHint() {
        const out = document.getElementById('out-content');
        const oldHint = out.querySelector('.floating-boundary-hint');
        if (oldHint) oldHint.remove();

        if (!moveMode) return;
        if (hoverBoundaryIndex === null || hoverBoundaryTop === null) return;

        const nextIndex = hoverBoundaryIndex;
        const isSplit = !!rawLogData[nextIndex]?.splitBefore;

        const line = document.createElement('div');
        line.className = 'floating-boundary-hint';
        line.style.top = `${hoverBoundaryTop}px`;
        line.innerHTML = `
            <button type="button">
                ${isSplit ? '點此處融合' : '點此處拆開'}
            </button>
        `;

        line.querySelector('button').addEventListener('click', function(e) {
            e.stopPropagation();
            toggleGroupBoundary(nextIndex);
        });

        out.appendChild(line);
    }

    function updateFloatingBoundaryFromPointer(e) {
        if (!moveMode) return;

        const out = document.getElementById('out-content');
        const logItem = e.target.closest('.log-item');

        if (!logItem || !out.contains(logItem)) {
            clearFloatingBoundaryHint();
            return;
        }

        const index = Number(logItem.dataset.index);
        if (Number.isNaN(index)) {
            clearFloatingBoundaryHint();
            return;
        }

        const nextItem = rawLogData[index + 1];
        if (!nextItem) {
            clearFloatingBoundaryHint();
            return;
        }

        const item = rawLogData[index];
        const canToggleThisBoundary =
            item &&
            nextItem &&
            item.ch !== '[main]' &&
            !isOtherChannel(item.ch) &&
            nextItem.ch !== '[main]' &&
            !isOtherChannel(nextItem.ch) &&
            canAutoJoin(item, nextItem);

        if (!canToggleThisBoundary) {
            clearFloatingBoundaryHint();
            return;
        }

        const rect = logItem.getBoundingClientRect();
        const outRect = out.getBoundingClientRect();

        const boundaryY = rect.bottom;
        const threshold = 18; // 可自己調整，越大越容易觸發
        const isNearBoundary = Math.abs(e.clientY - boundaryY) <= threshold;

        if (!isNearBoundary) {
            clearFloatingBoundaryHint();
            return;
        }

        const top = rect.bottom - outRect.top;
        const nextIndex = index + 1;

        if (hoverBoundaryIndex === nextIndex && hoverBoundaryTop === top) {
            return;
        }

        hoverBoundaryIndex = nextIndex;
        hoverBoundaryTop = top;
        renderFloatingBoundaryHint();
    }


    function commitEditing(options = {}) {
        const { rerender = true, keepViewport = false } = options;

        if (editingIndex === null) return true;

        const idx = editingIndex;
        const editingNode = document.querySelector(`[data-index="${idx}"] .text-content`);
        if (!editingNode) {
            editingIndex = null;
            return true;
        }

        const nextHtml = normalizeEditorText(editingNode);
        const didChange = rawLogData[idx]?.html !== nextHtml;
        rawLogData[idx].html = nextHtml;
        editingNode.contentEditable = "false";
        editingNode.onblur = null;
        editingIndex = null;

        saveToLocal({ rawLogChanged: didChange });

        if (rerender) {
            if (keepViewport) {
                rerenderKeepViewport();
            } else {
                liveRenderLog();
            }
        }

        return true;
    }

    function normalizeEditorText(el) {
        if (!el) return '';

        let text = el.innerText || '';

        // 統一換行格式
        text = text.replace(/\r\n/g, '\n');

        // 移除每行尾巴多餘空白
        text = text.replace(/[ \t]+\n/g, '\n');

        // 去掉頭尾多餘換行
        text = text.replace(/^\n+|\n+$/g, '');

        return text;
    }
</script>
